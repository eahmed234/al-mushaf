# Wujūh tied to particular places, overriding a rawi's profile there. Each entry cites its source.
#   rawi, category, word: the place; wujuh: what the rawi reads there;
#   elsewhere: what the rawi reads at other places of that category.
- rawi: ruways
  category: idgham_kabir
  word: "2:20:17"
  wujuh: [izhar, idgham]
  elsewhere: [izhar]
  source: "al-Futuh v1 pdf p. 62, fn 1: (لَذَهَب بِّسَمۡعِهِمۡ) قرأها السوسي، ورويس بخلاف عنه بالإدغام الكبير"
  also: "al-Qadi, al-Idah li-Matn al-Durrah, pp. 62-64 (Aljam3 16501/36683/64): Ruways idghams four places
    without khulf, and has both wujuh in a listed set incl. لَذَهَبَ بِسَمۡعِهِمۡ (al-Baqarah 20); elsewhere izhar"
  confirmed: "Eisa 2026-11-24 (khulf at 2:20; in general no idgham kabir)"
- rawi: ibn_dhakwan
  category: imala_zad
  word: "2:10:4"
  wujuh: [imala]
  elsewhere: [fath, imala]
  source: "al-Qadi, al-Wafi, p. 151 (books/wafi.txt): Ibn Dhakwān has imālah in the first زاد of the Qurʾān,
    فَزَادَهُمُ ٱللَّهُ مَرَضٗا (al-Baqarah 10), and fatḥ and imālah in the others"
  confirmed: "not yet (candidate)"
