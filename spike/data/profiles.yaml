    - {who: rest7, wujuh: [qasr, tawassut, ishba], cite: budur 15, note: "'لجميع القراء ثلاثة أوجه'; rawm only with qaṣr (p. 15)"}
    - {who: [ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris], wujuh: [qasr, tawassut, ishba], cite: budur 15}

