# How the 200 `open` lines of the unified uṣūl tables (pipeline/unified/*.yaml) are sorted (2026-11-26).
# Most were working notes, not questions (Eisa: "most of the questions don't look like questions").
# Keys are `category#index` into that table's `open` list. Read by pipeline.unify_merge:
#   policies   one ruling Eisa makes that settles every line it covers
#   questions  the line reworded as a question; stays in `questions` until Eisa answers
#   gaps       the extraction missed or cut something: re-read the page (pipeline/work/gaps/), then
#              the finding goes in `resolved` below and the line becomes a note or a question
#   noise      lines the fill script wrote that the table already settles (see `why`)
#   anything not keyed here is a note: kept with the table under `notes`, not asked.

policies:
  ahl_adaa:
    q: 'Views the book reports only from "some ahl al-adāʾ" (not the text of the poem or its usual reading): make
      them app options (off by default), or leave them out?'
    covers:
    - badal#1
    - basmalah#6
    - hamz_waqf#8
    - hamzatayn_kalimatayn_muttafiq#2
    - imala_ha_tanith#0
  footnotes:
    q: 'Wujūh that only an editor''s footnote records from another ṭarīq (al-Taḥbīr''s three ḥarakāt in the muttaṣil
      for Abū Jaʿfar and Yaʿqūb, idah 81 n. 4; Idrīs''s sakt from al-Mubhij, idah 121-123): options for the kubrā
      version only, or leave them out?'
    covers:
    - muttasil#0
    - sakt_al#2
    - sakt_mafsul#3
  order:
    q: Where a rāwī has two or more wujūh and the book states no preference, should the first one listed in the
      book be the default?
    covers:
    - hamz_mufrad#2
    - hamz_mufrad#5
    - hamzatayn#2
    - hamzatayn_kalimatayn_mukhtalif#1
    - hamzatayn_kalimatayn_muttafiq#1
    - hamzatayn_kalimatayn_muttafiq#3
    - munfasil#2
    - rawm_ishmam#1
    - silah_mim#0

questions:
  basmalah#0: 'Abū ʿAmr between two sūrahs: wafi 46 gives al-Dūrī and al-Sūsī waṣl and sakt only, but idah 50 says
    Yaʿqūb has "basmalah, sakt, waṣl like Abū ʿAmr", which gives Abū ʿAmr the basmalah too. The table has two wujūh
    for Abū ʿAmr and three for Yaʿqūb. Is that right?'
  basmalah#2: 'Abū Jaʿfar between two sūrahs: idah 50 gives him the basmalah "قولا واحدا", but idah 52 says he follows
    his aṣl in "the three wujūh of the basmalah" (Nāfiʿ: Qālūn the basmalah, Warsh two wujūh, wafi 45-46). Basmalah
    only, or his aṣl''s wujūh?'
  ha_mim_jam#3: 'Khalaf and Khallād stopping on the plural hāʾ: wafi 52 says Ḥamzah reads the hāʾ with kasr at waqf;
    wafi 53 says Khalaf and Khallād read it with ḍamm (mīm sākin). The table gives both, kasr first. Which is right,
    or both?'
  hamz_waqf#3: 'Ḥamzah stopping on مستهزءون: wafi 121 gives ḥadhf only, while the reviewed table (al-Budūr 22, Ghayth
    31) gives three wujūh: tashīl, ibdāl to yāʾ, ḥadhf. The three are kept for now. Confirm the three?'
  hamzatayn#1: 'Hishām with a second hamzah maksūrah: wafi 89 gives taḥqīq with or without idkhāl; the reviewed
    table (wafi 84) gives taḥqīq with idkhāl and tashīl with idkhāl. Which?'
  istiadha#0: 'Jahr or ikhfāʾ of the istiʿādhah for Qālūn, Warsh, Khalaf and Khallād: wafi 41 and 44 give jahr for
    all fourteen, and wafi 44 seems to prefer it; wafi 43-44 also report ikhfāʾ from Nāfiʿ and Ḥamzah. The table
    gives those four [jahr, ikhfāʾ]. Should jahr be the default and ikhfāʾ an option?'
  istiadha#1: 'Khalaf ʿan Ḥamzah: jahr at the start of al-Fātiḥah and ikhfāʾ elsewhere (wafi 44). Should that be
    his default, or one option beside plain jahr?'
  madd_lazim#1: 'Abū Jaʿfar on the first alif of آلآن and on الم أحسب الناس: his aṣl''s two ruwāt differ here (Qālūn
    and Warsh), and the Durrah rows don''t say whom Ibn Wardān and Ibn Jammāz follow. Qālūn''s reading, Warsh''s,
    or leave it to a farsh page?'
  rawm_ishmam#0: wafi 174 calls rawm and ishmām a "ṭarīq jamīl" for Abū ʿAmr and the Kūfīs, and says most ahl al-adāʾ
    also take it for the others as istiḥbāb. Should rawm and ishmām be offered as options for all fourteen?
  sakt_mafsul#0: 'Khalaf ʿan Ḥamzah''s sakt on the mafṣūl: wafi 105 gives him a little sakt with khulf; wafi 106
    says neither Khalaf nor Khallād makes sakt on the mafṣūl. The table gives Khalaf both (sakt first). Which?'
  silah_ha#6: 'بيده (Ruways) and ترزقانه (Ibn Wardān): idah 76 says qaṣr, and idah 79 says ikhtilās of the hāʾ''s
    vowel. The table reads them as one wajh, qaṣr. Is the ikhtilās a separate wajh?'
  ya_zaida#2: 'ولا تخزون في ضيفي: idah 180 says everyone drops the yāʾ in both states except Yaʿqūb, but the row
    just before on the same page has Abū Jaʿfar keeping it in waṣl. Does Abū Jaʿfar keep it in waṣl?'
  ya_zaida#3: 'Qālūn at التلاق and التناد: the poem gives him khulf (kept or dropped), but "the verifiers" say dropped
    only (wafi 196). The table gives [kept in waṣl, dropped]. Dropped only?'
