category: silah_ha
what: 'Hāʾ al-kināyah: its ṣilah, qaṣr and iskān, and the words read otherwise.'
wujuh:
- id: none
  ar: قصر الهاء / ترك الصلة
  en: 'no ṣilah: hāʾ with its vowel (qaṣr)'
- id: silah
  ar: صلة الهاء (إشباع)
  en: ṣilah (ishbāʿ), a wāw or yāʾ after the hāʾ
- id: sukun
  ar: إسكان الهاء
  en: sukūn of the hāʾ
- id: hamz_damm_qasr
  ar: همز ساكن مع ضم الهاء وقصرها
  en: sākin hamzah, ḍamm of the hāʾ, qaṣr (أرجئه)
- id: nohamz_kasr_qasr
  ar: ترك الهمز مع كسر الهاء وقصرها
  en: no hamzah, kasr of the hāʾ, qaṣr (أرجئه)
- id: hamz_kasr_qasr
  ar: همز ساكن مع كسر الهاء وقصرها
  en: sākin hamzah, kasr of the hāʾ, qaṣr (أرجئه)
- id: nohamz_silah
  ar: ترك الهمز مع صلة الهاء
  en: no hamzah, ṣilah (أرجئه)
- id: hamz_silah
  ar: همز ساكن مع صلة الهاء
  en: sākin hamzah, ṣilah (أرجئه)
- id: nohamz_sukun
  ar: ترك الهمز مع إسكان الهاء
  en: no hamzah, sukūn of the hāʾ (أرجئه)
- id: kasr_ha
  ar: كسر الهاء
  en: kasr of the hāʾ (أهله)
