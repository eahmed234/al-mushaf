open:
- The listed words of case 2 are as the rows write them (التى at idah 113); the rows do not say which words the rule is limited to beyond these
  three.
- wafi 114 says "المد المشبع بست حركات" and "القصر بمقدار حركتين"; no tawassuṭ or fractions.
filled_notes:
- Case 1 is stated for Khalaf ʿan Ḥamzah and Khallād only (wafi 114, "all waqf", khulf between ṭūl and qaṣr); the other twelve of the Shāṭibiyyah
  and all six of the Durrah have no row here.
- Case 2 is stated for Ibn Wardān and Ibn Jammāz only (khulf between tawassuṭ and qaṣr, idah 112-113); Ruways, Rawḥ, Isḥāq, Idrīs have no row,
  and the rest of the Shāṭibiyyah none.
