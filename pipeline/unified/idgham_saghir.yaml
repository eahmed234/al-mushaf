open:
- 'wafi 134 row on إذ before ذ: the extraction names the letters ''ذ ظ'' and its quote is cut off after ''نحو''; which letters it means is not
  settled.'
- The letters of قد and of هل وبل that the rows do not name are written as 'the four / three other letters'; the rows give no names.
- Abū Jaʿfar via asl for إذ before ت/د rows rests on idah 127 ('وقد وافق أصله في ذال إذ'); his قد and تاء rows are explicit izhār (idah 127);
  هل وبل izhār (idah 129).
- 'wafi 136: ''الباقون'' for عذت، فنبذتها، أورثتموها leaves Hishām out of the extracted readers; written as izhār with the rest.'
- 'wafi 135 ماليه هلك: both wujūh for all fourteen, in waṣl.'
- 'idah 135 فيغفر لمن يشاء: for Khalaf al-ʿĀshir only ''جزم الراء'' is stated, nothing on idghām.'
- 'wafi 137 يعذب من يشاء: the book says Ibn Kathīr''s only reading by the naẓm and his aṣl is izhār (the table follows).'
- 'idah 131-132 أخذت/اتخذت: Ruways izhār only; Rawḥ, Abū Jaʿfar, Khalaf idghām; wafi 137 اتخذتم/أخذتم: Ḥafṣ, Bazzī, Qunbul izhār.'
- 'Khalaf ʿan Ḥamzah on بل طبع الله عليها: izhār ''قولا واحدا'' (wafi 134), Khallad has both (wafi 133).'
- 'Idah p.131 row on Ruways: ''أخذت'' (3 forms) and ''اتخذت'' (2 forms) are the book''s own wordings; merged into one entry with the Wāfī''s اتخذتم/أخذتم.'
filled_notes:
- 'Agreed idghām cases (إذ before ذ, دال قد before ت د, تاء التأنيث before ت د ط, mithlayn): al-Īḍāḥ has no row for the six ruwāt of the Durrah
  (wafi 134 only); left empty.'
- 'Yaʿqūb (Ruways, Rawḥ): no row for لام هل وبل except هل ترى (idah 128), and none for the mithlayn; left empty. idah 69 says only ''يظهر فيما
  عداها مثلين أو متقاربين'' (how far it reaches is not clear).'
- 'Khalaf al-ʿĀshir (Isḥāq, Idrīs): لام هل وبل izhār only where Khalaf ʿan Ḥamzah idghāms (ت ث س, idah 128); the other letters are not stated;
  left empty.'
- 'wafi 136 rāʾ sākinah before lām: the rows state only Abū ʿAmr (Dūrī khulf, Sūsī idghām); no row for the others.'
- 'idah 129/130/132 ''كأصله'' rows for Abū Jaʿfar: written as izhār (aṣl Nāfiʿ) without splitting Qālūn and Warsh, since no row differs.'
