category: hamzatayn_kalimatayn_mukhtalif
what: two hamzahs at the meeting of two words with different vowels (five darbs)
wujuh:
- {id: tahqiq, ar: تحقيق الهمزتين, en: both hamzahs fully pronounced}
- {id: tashil_ya, ar: تسهيل الثانية بين الهمزة والياء, en: the second hamzah eased between hamzah and yāʾ}
- {id: tashil_waw, ar: تسهيل الثانية بين الهمزة والواو, en: the second hamzah eased between hamzah and wāw}
- {id: ibdal_waw, ar: إبدال الثانية واوا محضة, en: the second hamzah turned into a pure wāw}
- {id: ibdal_ya, ar: إبدال الثانية ياء محضة, en: the second hamzah turned into a pure yāʾ}
