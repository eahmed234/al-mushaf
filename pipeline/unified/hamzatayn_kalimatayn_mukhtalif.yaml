listed: []
open: ['The rest eight of al-Wāfī (Hishām … al-Dūrī al-Kisāʾī) read taḥqīq in the five darbs: no row of wafi 97 says it for the wasl case in so many words (the row says only that the seven agree on taḥqīq
    of the first hamzah, and taḥqīq of the second when one stops on the first); the table follows the reviewed profile row (wafi 97).', 'Durrah ruwāt for the waqf case: no row of al-Īḍāḥ; Ibn Wardān, Ibn
    Jammāz, Ruways left empty. Rawḥ and the Khalaf pair are filled from their general statements (idah 98, 99), not from a waqf row.', 'idah 98: for Ibn Wardān, Ibn Jammāz and Ruways the row says ''كأصله
    في الأقسام الخمسة'' and that the nāẓim omitted Abū Jaʿfar and Ruways in the mukhtalifatayn, yet the same page then states each of the five darbs explicitly; the table uses the explicit statements (not
    marked via asl) and does not decide whether they equal Nāfiʿ''s/Abū ʿAmr''s.', 'wafi 96 darb 5 and idah 98 darb 5: two wujūh (tashīl like yāʾ, or pure ibdāl to wāw) as khulf for all six of al-Wāfī and
    the three of al-Īḍāḥ; no order of preference beyond listing tashīl first.', 'Isḥāq and Idrīs (idah 99): taḥqīq of the muttafiqatayn and mukhtalifatayn as their aṣl Khalaf''s; marked via aṣl.']
