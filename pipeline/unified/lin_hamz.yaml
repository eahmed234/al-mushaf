open:
- Case 2 is stated for the other twelve of al-Wāfī only "عند الوقف" (wafi 82, 83); their waṣl reading of a final hamzah is not stated (taken as case 1 by the profile only). Warsh is "waṣlan wa-waqfan" (wafi 83).
- 'Case 2, the Durrah: idah 84 gives "قصر مد اللين" for the three imāms without separating waqf or a final hamzah; nothing says whether the waqf wujūh of al-Wāfī apply to them.'
- 'wafi 82: Warsh''s two wujūh are called "الطول والقصر" in the quote, where the row marks tawassuṭ; the table follows the rows (tawassuṭ, ṭūl) and the profile. The row''s exceptions (ابنى آدم, ولو آمن) are not līn-before-hamzah in one word.'
- Ruways, Rawḥ, Isḥāq, Idrīs are cited from idah 84 "فاتفق الثلاثة"; the profile cites a footnote (idah 84 n. 3).
- 'The word سوءات: the book says the khulf is between qaṣr and tawassuṭ (wafi 83).'
- 'Lengths: tawassuṭ 4 ḥarakāt = 2 alifs, ṭūl 6 = 3; no fractions.'
