open:
  - "Every case: al-Wāfī 158-160 speaks only of al-Kisāʾī (Abū l-Ḥārith, al-Dūrī); no row for the other twelve of the fourteen or for the six Durrah ruwāt, so they are left empty (wafi 158-160)."
  - "Wafi 159: some ahl al-adāʾ made imālah for al-Kisāʾī after every letter except the alif; a view the book reports, not put in the table."
  - "Wafi 158: the row names nine letters (ح ق ض ا ط ع ص خ ظ) while the book calls them 'ten'; the tenth is not in the rows."
