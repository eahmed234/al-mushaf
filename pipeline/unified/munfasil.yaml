open:
- 'al-Wāfī p. 74: tawassuṭ is "4 ḥarakāt" = 2 alifs, ṭūl "6 ḥarakāt" = 3 alifs; no fraction in the rows.'
- al-Īḍāḥ p. 82 (row tagged munfaṣil) says tawassuṭ for all six ruwāt of the Durrah, which contradicts idah 83 (qaṣr for Ibn Wardān, Ibn Jammāz, Ruways, Rawḥ). The quote ("توسيط المدين - المتصل") looks like it is about the muttaṣil; table follows idah 83.
- 'Qālūn and al-Dūrī: both wujūh given, qaṣr first as al-Wāfī lists it; the book does not say which is preferred (wafi 74).'
- The reviewed profile rows call the remaining group "rest7"; the rows name six (Hishām, Ibn Dhakwān, Shuʿbah, Ḥafṣ, Abū l-Ḥārith, al-Dūrī ʿan al-Kisāʾī), which is what the table uses.
