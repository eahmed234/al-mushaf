category: basmalah
what: The basmalah between surahs and at a surah's start, al-Anfāl/Barāʾah, and the start of a juzʾ; one wording for all twenty.
wujuh:
- id: basmala
  ar: البسملة
  en: basmalah between the two
- id: sakt
  ar: السكت بلا بسملة
  en: sakt without basmalah
- id: wasl
  ar: الوصل بلا بسملة
  en: waṣl without basmalah
- id: waqf
  ar: الوقف على آخر السورة
  en: waqf at the end of the surah
- id: no_basmala
  ar: ترك البسملة
  en: no basmalah
