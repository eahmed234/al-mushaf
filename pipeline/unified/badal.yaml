open:
- Lengths are three; the rows say tawassuṭ "4 ḥarakāt" (2 alifs) and ṭūl "6 ḥarakāt" (3 alifs); no fractions.
- 'wafi 78: for عاداً الأولى some ahl al-adāʾ allow only qaṣr and others give Warsh all three (one row says "in each of آلآن, عاداً الأولى" all
  three). Table gives the three; the qaṣr-only view is left here. The row''s exceptions are سيرتها الأولى and فلله الآخرة والأولى.'
- 'wafi 77: for آلآن the book says qaṣr only for the last alif; the first alif of آلآن is under madd_lazim.'
- 'The six Durrah ruwāt: only the one statement "قصر البدل" for all three imāms (idah 84); nothing about Warsh-like exceptions, so no exceptions
  are listed for them.'
- 'wafi 75: hamzah "ثابت أو مغير"; Warsh''s three wujūh and the khulf marker are for Warsh only.'
