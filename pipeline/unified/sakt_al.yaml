open:
- wafi 106 puts Khallād with Khalaf on the sakt of both (the row says sakt); the reviewed profile gives Khallād two wujūh (sakt and none) with
  the same page. Table follows the row; the profile's second wajh is left here.
- 'wafi 105-106: Khalaf''s sakt on لام التعريف is "قليل"; the row does not separate the two words for Khallād.'
- 'Idrīs: the editor records a sakt khulf for a sākin that is not a madd (al-Muṭṭawwiʿī, from al-Mubhij, which needs ishbāʿ of the muttaṣil, idah
  123); the Durrah says "والسكت أهملا" and the shārḥ and most take none (profile, idah 121-123). Table: none; the sakt is an option here, default
  none.'
- 'Abū Jaʿfar''s and Yaʿqūb''s ruwāt: idah 124 "كأصليهما" (a sakt_mafsul row); their aṣl, Nāfiʿ and Abū ʿAmr, have none, which the table gives.
  The Durrah rows speak of the mafṣūl; none has a row for lām al-taʿrīf or شيء, and the reviewed profile cites idah 121-123 for Isḥāq and Idrīs.'
filled_notes:
- The book says nothing of waqf here (Warsh's naql on the same words is in the naql category).
