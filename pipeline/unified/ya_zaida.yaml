open:
- 'Bare ''الإثبات'' in the Wāfī was read as the reader''s general form from wafi 193 (Nāfiʿ, Abū ʿAmr, Ḥamzah, al-Kisāʾī: kept in waṣl; Ibn Kathīr:
  kept in both; Hishām: khulf), see each entry; entries list the reading for all named readers, not only the ones that differ from the case.'
- 'Ibn Wardan and Ibn Jammāz: idah 173 gives only ''kept in waṣl'' for all the yāʾāt he keeps (kept_wasl); at يردن/تتبعن/فما آتاني idah gives
  him opened in waṣl and sākin in waqf (recorded: kept_both for the first two, kept_wasl for فما آتاني where waqf is dropped). Qālūn keeps تتبعن
  in waṣl only (wafi 194), so Abū Jaʿfar does not follow Qālūn there.'
- 'idah 180: for ولا تخزون في ضيفي the book says all readers drop the yāʾ in both states except Yaʿqūb, but the previous row (idah 180) has Abū
  Jaʿfar keeping it in waṣl; both recorded (Abū Jaʿfar kept_wasl).'
- 'wafi 196: Qālūn at التلاق/التناد: khulf (kept or dropped) in the naẓm, yet ''the verifiers say dropped only'' (row 84); recorded [kept_wasl,
  dropped].'
- 'wafi 193 vs 194 for Ḥamzah at أتمدونن: kept in waṣl and waqf (193) vs bare ''الإثبات'' (194); recorded kept_both.'
- Kisāʾī's two ruwāt appear only at نبغ/يأت (wafi 194) and the general wafi 193; no other word names them.
- The ya_zaida wujūh `kept_waqf` (dropped in waṣl, kept in waqf) is used for Rawḥ and Ruways at فبشر عباد، يردن، فما آتاني، واخشون اليوم where
  the rows say so.
- 'Yaʿqūb''s long lists of verse-end yāʾāt (idah 176-178) overlap with other entries (e.g. التلاق، التناد، يسر، أكرمن، المتعال): the same words
  are entered twice, once with the Shāṭibiyyah readers and once in the Yaʿqūb list.'
filled_notes:
- 'Ibn Dhakwan, Shuʿbah and Ḥafṣ: no row gives them a general reading of the yāʾāt al-zawāʾid (wafi 193 names Ibn Kathīr, Hishām, Abū ʿAmr, Ḥamzah,
  al-Kisāʾī, Nāfiʿ only); the case is left empty for them. Ibn Dhakwan appears at فلا تسألني (khulf) and فما آتاني (dropped); Ḥafṣ at فما آتاني.'
- 'A rāwī who is not named at a word: the rows do not say ''dropped'', except wafi 195 for فما آتاني (''الباقون'' drop in both states). Entries
  therefore list only the readers a row names; that nothing else is kept is not stated by the rows.'
- 'يهديني (wafi 197, all fourteen keep): the waqf state is not stated.'
- Abū Jaʿfar's 'كأصله' words (idah 181) take Nāfiʿ's reading where the Wāfī rows name Qālūn and Warsh alike; no row separates them.
