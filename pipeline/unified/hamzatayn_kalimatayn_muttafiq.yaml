category: hamzatayn_kalimatayn_muttafiq
what: two hamzahs at the meeting of two words, both with the same vowel
wujuh:
- id: tahqiq
  ar: تحقيق الهمزتين
  en: both hamzahs fully pronounced
- id: isqat_ula
  ar: إسقاط الهمزة الأولى
  en: the first hamzah dropped
- id: tashil_ula
  ar: تسهيل الأولى بين بين
  en: the first hamzah eased between
- id: ibdal_ula_waw_idgham
  ar: إبدال الأولى واوا وإدغام الواو قبلها فيها
  en: the first hamzah turned into wāw and the preceding wāw merged into it
- id: tashil_thaniya
  ar: تسهيل الثانية بين بين
  en: the second hamzah eased between
- id: ibdal_thaniya
  ar: إبدال الثانية حرف مد مجانسا لحركة الأولى
  en: the second hamzah turned into a madd letter matching the vowel of the first
- id: ibdal_thaniya_ya
  ar: إبدال الثانية ياء مكسورة
  en: the second hamzah turned into a kasrah yāʾ
