listed:
- words:
  - أول الفاتحة
  case: manner at the start of recitation
  ruwat:
    khalaf_an_hamzah:
    - jahr
  cite:
  - wafi 44
open:
- 'Wafi 41 and 44 say the istiʿādhah is aloud for all fourteen in the whole Qurʾān; wafi 43 and 44 report ikhfāʾ from Ḥamzah (Khalaf, Khallād) and Nāfiʿ (Qālūn, Warsh). Both are kept: those four have [jahr,
  ikhfa]; the book''s own judgement between them is not in the rows (wafi 44 ''بل أخذوا بالجهر…'' reads as preferring jahr; wafi 43 ''على ما جرى عليه كثير من الشراح'' marks the ikhfāʾ as the commentators''
  reading of the line).'
- 'Khalaf ʿan Ḥamzah: jahr at the start of al-Fātiḥah only and ikhfāʾ in the rest of the Qurʾān (wafi 44); shown in the table as [jahr, ikhfa] and in listed (أول الفاتحة); the rows do not say which of the
  two wins elsewhere.'
- 'Khallād: wafi 44 says the reader is given the choice between jahr and ikhfāʾ.'
- 'Qālūn and Warsh: ikhfāʾ in all the Qurʾān is a narration of al-Musayyabī from Nāfiʿ (wafi 44).'
- 'Wafi 42: the reader is not bound to the wording; shortening or adding to it is allowed. Not a wajh, not in the table.'
- 'al-Īḍāḥ has no istiʿādhah row: the six Durrah ruwāt are empty in every case.'
- The wording case and the manner case say nothing about waqf or about repeating the istiʿādhah mid-recitation.
