  en: the wording أعوذ بالله من الشيطان الرجيم
- id: jahr
  ar: الجهر بالتعوذ
  en: istiʿādhah aloud
- id: ikhfa
  ar: إخفاء التعوذ
  en: istiʿādhah silent
