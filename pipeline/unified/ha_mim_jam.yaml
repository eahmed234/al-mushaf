category: ha_mim_jam
what: The hāʾ of the plural pronoun after a yāʾ (عليهم، إليهم، لديهم) and the hāʾ and mīm before a sākin (عليهمُ القتال، قلوبهمِ العجل).
wujuh:
- id: kasr_ha
  ar: كسر الهاء
  en: kasr of the hāʾ
- id: damm_ha
  ar: ضم الهاء
  en: ḍamm of the hāʾ
- id: damm_mim
  ar: ضم الميم من غير صلة
  en: ḍamm of the mīm without ṣilah
- id: kasr_mim
  ar: كسر الميم
  en: kasr of the mīm
- id: itbaa
  ar: إتباع حركة الهاء
  en: the mīm follows the vowel of the hāʾ (itbāʿ)
- id: sukun_mim
  ar: إسكان الميم
  en: sukūn of the mīm (waqf)
