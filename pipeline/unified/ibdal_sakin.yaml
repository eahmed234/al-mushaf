category: ibdal_sakin
what: ibdāl of a sākin hamzah into a madd letter (Warsh, al-Sūsī, Abū Jaʿfar) and its listed exceptions
wujuh:
- {id: tahqiq, ar: تحقيق الهمزة الساكنة, en: the sākin hamzah pronounced}
- {id: ibdal, ar: إبدال الهمزة الساكنة حرف مد, en: the sākin hamzah turned into a madd letter matching the vowel before it}
