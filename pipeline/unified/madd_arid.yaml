open:
- idah 85 says only "والمد العارض … كأصله" for the six; table gives each aṣl's wujūh (Nāfiʿ, Abū ʿAmr, Khalaf ʿan Ḥamzah all three here). The aṣl's own wujūh are taken from wafi 79-80; case 2 not stated for the Durrah, left empty.
- 'wafi 82: the quote for case 2 ("إلا وجه الثلاثة وقفاً") reads unclearly; the row records the three wujūh for all fourteen, which the table uses.'
- Rawm only with qaṣr (budur 15, from the reviewed profile; not in these rows).
- 'wafi 79 lists ṭūl then tawassuṭ, wafi 80 adds qaṣr; no preference among them. Lengths: tawassuṭ 4 ḥarakāt (2 alifs), ṭūl 6 (3 alifs); no fractions.'
