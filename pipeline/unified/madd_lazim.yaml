listed:
- words:
  - آلآن
  case: madd letter before a lāzim sākin in a word (الضالين, الطامة, الصاخة, وحاجه قومه, آلله خير)
  ruwat:
    qalun:
    - ishba
    - qasr
    warsh:
    - ishba
    - qasr
  cite:
  - wafi 77
  why: the first alif only; ishbāʿ keeps the original, qaṣr the other wajh
- words:
  - هاتين
  - اللذين
  case: madd letter before a lāzim sākin in a word (الضالين, الطامة, الصاخة, وحاجه قومه, آلله خير)
  ruwat:
    bazzi:
    - tawassut
    - ishba
    qunbul:
    - tawassut
    - ishba
  cite:
  - wafi 81
  why: the shaddah nūn of Ibn Kathīr's reading
- words:
  - الم أحسب الناس
  case: madd letter in the openings' letters of three letters (لام, ميم, طسم, حم, كاف, صاد, ق, سين, نون)
  ruwat:
    warsh:
    - ishba
    - qasr
  cite:
  - wafi 81
  why: the mīm after the hamzah's vowel is moved to it (al-ʿAnkabūt)
open:
- 'Lengths: ʿayn "4 ḥarakāt" = tawassuṭ (2 alifs) or 6 = ishbāʿ (3 alifs) (wafi 81); no fractions. For the others the rows say "المد المشبع ست
  حركات".'
- 'Abū Jaʿfar''s ruwāt on آلآن (first alif) and on الم أحسب الناس: their aṣl is Nāfiʿ, whose two ruwāt differ from case 1/2 in these words (Qālūn
  and Warsh above); the rows do not say which Ibn Wardān and Ibn Jammāz follow, so the listed words are not extended to them.'
- 'Case 1: the rows list the words as examples only (الضالين, الطامة, الصاخة, وحاجه قومه, آلله خير, ص, ق, ن); the book names no exceptions in
  this category.'
- Case 4 quote ("المد المشبع نظراً …") is cut off in the row; the second wajh is qaṣr per the row's tag only.
- 'wafi 80: "ميم الم" before a transferred hamzah is Warsh''s only (listed); the other thirteen are not mentioned.'
filled_notes:
- 'The Durrah: one row, idah 85 ("كأصولهم في المد اللازم بجميع أنواعه"); every case except case 5 is filled with the aṣl''s wujūh (via asl), which
  all agree between the aṣl''s two ruwāt. Case 5 (two-letter letters, ألف) is not lāzim and the row does not reach it: left empty.'
