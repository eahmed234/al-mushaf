  - hamz_waqf_mid
  - hamz_waqf_zaid
  - hamzatayn_waqf
  - ibdal_sakin_waqf
  - rawm_ishmam_waqf_hamz
  - ibdal_idgham_riya
  - ha_anbihim_waqf
  - waqf_hamza_rasm
  - hamz_waqf_all
