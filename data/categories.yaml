# Categories of the reading model, one per rule, for all twenty ruwāt (Shāṭibiyyah and Durrah
# together). Revised 2026-11-26 from Eisa's review of the uṣūl run (pipeline/reviews/
# categories-2026-11-26.json). `rows`: the category names the extraction used that belong here.
# kind: rule = a rāwī's general wujūh plus listed words; per_word = stored per word, like farsh.
istiadha:
  what: 'the istiʿādhah: its wording, aloud or silent'
  kind: rule
  rows:
  - istiadha_jahr
  - istiadha_lafz
basmalah:
  what: the basmalah between surahs and at a surah's start; al-Anfāl/Barāʾah; the start of a juzʾ (one wording for all twenty)
  kind: rule
  rows:
  - basmalah
  - basmalah_zahr
  - basmala_bayna_surtayn
  - basmala_arbaa_zuhr
  - basmala_awwal_sura
  - anfal_bara_a
  - basmala_ruus_ajza
  - basmala_awjuh_surtayn
ha_mim_jam:
  what: 'the hāʾ and mīm of the plural pronoun: the hāʾ''s vowel after yāʾ (عليهم، إليهم، لديهم…) and both before a sākin (عليهمُ القتال، قلوبهمِ
    العجل; itbāʿ)'
  kind: rule
  rows:
  - damm_ha_alayhim
  - ha_jam_damm_kasr
  - mim_before_sakin
  - mim_jam_before_sakin
  - ha_before_mim_jam
  note: 'ha_jam and mim_jam_sakin combined (Eisa 2026-11-26: the same letters in the same words)'
silah_mim:
  what: ṣilah of mīm al-jamʿ before a consonant (and with an attached pronoun)
  kind: rule
  rows:
  - silah_mim
  - mim_with_pronoun
silah_mim_hamza:
  what: ṣilah of mīm al-jamʿ before hamzat al-qaṭʿ
  kind: rule
  rows:
  - silah_mim_hamza
silah_ha:
  what: 'hāʾ al-kināyah: ṣilah, qaṣr, iskān; its listed words'
  kind: rule
  rows:
  - silah_ha
  - ha_kinaya_iskan
  - arjih_hamz
  - kasr_ha_ahlihi
idgham_kabir:
  what: 'idghām kabīr (al-Sūsī, Yaʿqūb''s places): what merges, rawm/ishmām, the madd before it'
  kind: rule
  rows:
  - idgham_kabir
  - idgham_kabir_ishmam_rawm
  - madd_before_idgham_kabir
  - mim_before_ba_ikhfa
munfasil:
  what: 'madd munfaṣil (lengths: qaṣr 1, tawassuṭ 2, ṭūl 3 alifs; Eisa 2026-11-25)'
  kind: rule
  rows:
  - munfasil
muttasil:
  what: 'madd muttaṣil (lengths: qaṣr 1, tawassuṭ 2, ṭūl 3 alifs; Eisa 2026-11-25)'
  kind: rule
  rows:
  - muttasil
badal:
  what: 'madd al-badal (lengths: qaṣr 1, tawassuṭ 2, ṭūl 3 alifs; Eisa 2026-11-25)'
  kind: rule
  rows:
  - badal
lin_hamz:
  what: 'līn before a hamzah (lengths: qaṣr 1, tawassuṭ 2, ṭūl 3 alifs; Eisa 2026-11-25)'
  kind: rule
  rows:
  - lin_hamz
madd_arid:
  what: 'madd ʿāriḍ at a stop (lengths: qaṣr 1, tawassuṭ 2, ṭūl 3 alifs; Eisa 2026-11-25)'
  kind: rule
  rows:
  - madd_arid
madd_lazim:
  what: madd lāzim and the openings' letters
  kind: rule
  rows:
  - madd_lazim
  - madd_fawatih
  - madd_fawatih_mim_wasl
  - madd_fawatih_ayn
  - madd_hatayn_allathayn
  - fawatih_two_letter_qasr
  - fawatih_alif_qasr
  - madd_aalaan_first_alif
madd_hamz_mughayyar:
  what: the madd before a changed hamzah
  kind: rule
  rows:
  - madd_qabl_hamz_mughayyar
  - madd_before_tashil
hamzatayn:
  what: two hamzahs in one word, with hamzat al-waṣl, istifhām/ikhbār (listed words)
  kind: rule
  rows:
  - hamzatayn
  - hamzat_wasl_istifham
  - istifham_ikhbar
  - istifham_mukarrar
  - haa_antum
hamzatayn_kalimatayn_muttafiq:
  what: two hamzahs across words, same vowel
  kind: rule
  rows:
  - hamzatayn_kalimatayn_muttafiq
hamzatayn_kalimatayn_mukhtalif:
  what: two hamzahs across words, different vowels
  kind: rule
  rows:
  - hamzatayn_kalimatayn_mukhtalif
ibdal_sakin:
  what: ibdāl of the sākin hamzah, and its listed exceptions
  kind: rule
  rows:
  - ibdal_sakin
hamz_mufrad:
  what: the single moving hamzah's listed words (مؤجلا، لئلا، النبيء، اللائي…)
  kind: rule
  rows:
  - ibdal_maftuha_baad_damm
  - yaltikum_hamza_zaida
  - ibdal_ya_lialla
  - hamz_mutaharrik
  - hamz_waw_ula_qalun
  - juz_hadhf_idgham
  - ibdal_idgham_ya
  - tashil_hamz_mufrad
  - laai
  - laai_yainasna_hamza
  - li_alla
  - nabi_ibdal
  - ad_ula
naql:
  what: naql of a hamzah's vowel to the sākin before it (mafṣūl ʿām and khāṣ), beginning after naql
  kind: rule
  rows:
  - naql
  - ibtida_lam_naql
  - idgham_ha_maliyah
sakt_al:
  what: 'sakt on the mafṣūl khāṣ: lām al-taʿrīf and شيء'
  kind: rule
  rows:
  - sakt_al
sakt_mafsul:
  what: sakt on the mafṣūl ʿām; for the Durrah, no sakt at all
  kind: rule
  rows:
  - sakt_mafsul
  - sakt_mutlaq
  note: the Shāṭibiyyah's and the Durrah's sakt in one category (Eisa 2026-11-26)
hadhf_damm:
  what: dropping the hamzah of مستهزءون and the like
  kind: rule
  rows:
  - hadhf_damm
hamz_waqf:
  what: 'Ḥamzah''s and Hishām''s stop on the hamzah: sākin, final, middle, after a prefix, two hamzahs; rawm/ishmām; following the rasm'
