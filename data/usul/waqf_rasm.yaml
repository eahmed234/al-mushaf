- id: whole_word
  ar: الوقف على الكلمة كما في الرسم (ويكأن)
  en: stop at the end of the word (ويكأن)
- id: on_ya_wayka
  ar: الوقف على الياء (ويكأن)
  en: stop on the yāʾ (ويكأن)
- id: on_kaf
  ar: الوقف على الكاف (ويكأن)
  en: stop on the kāf (ويكأن)
- id: on_ma_ayya
