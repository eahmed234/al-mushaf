- id: alif_ayyuha
  ar: الوقف بالألف (أيه)
  en: stop with alif (أيه)
- id: fath_ha
  ar: فتح الهاء وصلا
  en: fatḥ of the hāʾ in waṣl
- id: damm_ha
  ar: ضم الهاء وصلا
  en: ḍamm of the hāʾ in waṣl
- id: no_ha_sakt
  ar: حذف الهاء على الرسم
  en: no hāʾ al-sakt, as the rasm
- id: ha_sakt
  ar: هاء السكت
  en: hāʾ al-sakt
- id: ha_sakt_waqf_only
  ar: إثبات الهاء وقفا وحذفها وصلا
  en: hāʾ kept at a stop, dropped in waṣl
- id: ha_sakt_both
  ar: إثبات هاء السكت في الحالين
  en: hāʾ kept in both
- id: ha_dropped_wasl
  ar: حذف هاء السكت وصلا
  en: hāʾ al-sakt dropped in waṣl
- id: ya_ithbat
  ar: الوقف بإثبات الياء
  en: stop with the yāʾ restored
- id: ya_hadhf
  ar: حذف الياء
  en: yāʾ dropped (at a stop, or in both states)
