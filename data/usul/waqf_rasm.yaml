notes:
- 'Wafi 179-180: general stopping on the rasm gives the ten named there follow_rasm, the four (Bazzī, Qunbul, Hishām, Ibn Dhakwān) as istiḥsān;
  the first class of wafi 180 (hāʾ al-taʾnīth written with hāʾ) is not a row. — re-read (wafi 180): Wafi 180 divides the taʾnīth hāʾ into two
  classes: those written with hāʾ (فيما رحمة من الله، نعمة فمن الله، بقية) and those written with a long tāʾ. For the first class it says there
  is no disagreement among the readers: the stop is with hāʾ, following the rasm. The second class is the existing row.'
- 'Wafi 183 أيا ما: ''وقفا على أيا'' for Ḥamzah and al-Kisāʾī with tanwīn turned into alif is given as on_ayya; the Durrah''s ''كأصلهما'' for
  Ibn Wardān, Ibn Jammāz and Rawh is given via aṣl (Qālūn/Warsh, al-Dūrī/al-Sūsī: on ما, wafi 183); Ibn Wardān''s aṣl is Nāfiʿ, Rawh''s Abū ʿAmr.'
- 'ويكأن (idah 158): Ibn Wardān, Ibn Jammāz, Ishaq and Idris ''like Yaʿqūb'' is given as Yaʿqūb''s reading (via: model_yaqub), not via aṣl; Yaʿqūb''s
  own stops are ''on the hāʾ'' of ويكأنه and ''on the nūn'' of ويكأن, read here as the end of the word (same wajh as the fourteen''s ''as in the
  rasm''), which the rows do not themselves say.'
- 'The Durrah''s يا أبت for Ruways/Rawh/Ibn Wardān/Ibn Jammāz (idah 147): hāʾ; for Khalaf al-ʿĀshir (Ishaq, Idris): tāʾ ''on the rasm'' (idah
  147).'
- 'Wafi 181-182: the hāʾ of أيه in waṣl is a waṣl reading inside this stop category, given as its own case (damm_ha / fath_ha).'
- 'Idah 152, سلطانيه ماليه ماهيه: Khalaf al-ʿĀshir keeps the hāʾ in both states (ha_sakt_both); Yaʿqūb keeps it at a stop and drops it in waṣl;
  for the four words at idah 153-154 the rows speak of Yaʿqūb only.'
