filled_notes:
- 'Cases where one book gives readings and the other is silent: the Durrah ruwāt are left empty for the first four, مال (except Ruways and Rawh),
  أيه and the hāʾ of أيه in waṣl; the fourteen are left empty for the Yaʿqūb-only hāʾ al-sakt cases, the yāʾ cases and the Durrah''s يا أبت; each
  is listed per case below.'
- 'يا أبت (wafi 181): the book names only Ibn Kathīr and Ibn ʿĀmir (Bazzī, Qunbul, Hishām, Ibn Dhakwān) for hāʾ; the rest of the fourteen are
  left empty, not given the rasm''s tāʾ.'
- 'Hāʾ al-sakt (idah 147-154): Yaʿqūb''s two are given the same except where the rows name Ruways alone (the nudbah words and ثم, idah 151); the
  rows give Rawh nothing for those, left empty at those two cases.'
- 'case stopping on the rasm in general: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 179, wafi 180)'
- 'case hāʾ al-taʾnīth written with a tāʾ: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 180)'
- 'case يا أبت: no row speaks of qalun, warsh, duri_abuamr, susi, shuba, hafs, khalaf_an_hamzah, khallad, abul_harith, duri_kisai (left empty;
  idah 147, wafi 181)'
- 'case كأين: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 181)'
- 'case مال: no row speaks of ibn_wardan, ibn_jammaz, ishaq, idris (left empty; idah 157, wafi 181)'
- 'case أيه: no row speaks of qalun, warsh, bazzi, qunbul, hisham, ibn_dhakwan, shuba, hafs, khalaf_an_hamzah, khallad, ibn_wardan, ibn_jammaz,
  ruways, rawh, ishaq, idris (left empty; wafi 182)'
- 'case أيه in waṣl: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 182)'
- 'case ما istifhāmiyyah after a preposition: no row speaks of ibn_wardan, ibn_jammaz, ishaq, idris (left empty; idah 147, wafi 183)'
- 'case هو، هي: no row speaks of qalun, warsh, bazzi, qunbul, duri_abuamr, susi, hisham, ibn_dhakwan, shuba, hafs, khalaf_an_hamzah, khallad,
