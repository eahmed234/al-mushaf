filled_notes:
- Case 2 is stated for the other twelve of al-Wāfī only "عند الوقف" (wafi 82, 83); their waṣl reading of a final hamzah is not stated (taken as
  case 1 by the profile only). Warsh is "waṣlan wa-waqfan" (wafi 83).
notes:
- 'Case 2, the Durrah: idah 84 gives "قصر مد اللين" for the three imāms without separating waqf or a final hamzah; nothing says whether the waqf
  wujūh of al-Wāfī apply to them. — re-read (idah 84, idah 85): Idah 84 gives Abū Jaʿfar qaṣr (no madd at all) of the līn letter before a hamzah,
  for the examples شيئا and سوءة, with no condition of waqf or of a final hamzah; the editor''s note 3 says the three agree on this qaṣr, and
  then quotes the Shāṭibiyyah verses (which carry the waqf wujūh) only as the comparison. Idah 85 note 1 says the three follow their aṣl in madd
  lāzim and the madd ʿāriḍ lil-sukūn, which the Durrah leaves unmentioned; it does not name līn. So the page gives the six qaṣr alone, and nothing
  carries al-Wāfī''s waqf wujūh over to them.'
- 'wafi 82: Warsh''s two wujūh are called "الطول والقصر" in the quote, where the row marks tawassuṭ; the table follows the rows (tawassuṭ, ṭūl)
  and the profile. The row''s exceptions (ابنى آدم, ولو آمن) are not līn-before-hamzah in one word. — re-read (wafi 82): Wafi 82 explains that
  the naẓm''s ''ṭūl and qaṣr'' for Warsh means ṭūl (six) and tawassuṭ, with qaṣr there meaning the shorter madd, not two ḥarakāt. The exceptions
  ابنى آدم and ولو آمن are excluded by the word ''in one word'' (the hamzah is in the next word); Warsh does naql there, so they are not līn-before-hamzah.'
- Ruways, Rawḥ, Isḥāq, Idrīs are cited from idah 84 "فاتفق الثلاثة"; the profile cites a footnote (idah 84 n. 3).
- 'The word سوءات: the book says the khulf is between qaṣr and tawassuṭ (wafi 83).'
- 'Lengths: tawassuṭ 4 ḥarakāt = 2 alifs, ṭūl 6 = 3; no fractions.'
