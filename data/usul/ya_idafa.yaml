filled_notes:
- al-Wāfī states the opened-readers of the hamzat qatʿ classes (maftūḥah, maksūrah) and then lists exceptions word by word; for the readers it
  does not name in a class the rows give no default, so they stay empty in the case (wafi 185, 188). Where a word row says 'الباقون' / names the
  rest, the word entry carries it.
- 'Abū Jaʿfar ''كقالون'' (idah 161, 167): entries carry Qālūn''s reading for him where a row for Qālūn exists, with via asl; where Qālūn is not
  stated he is left empty. The three explicit exceptions: ولي دين (sukūn), إخوتي إن (opened), رب إن (opened).'
- 'Which readers of the fourteen do not appear in a class case (empty): no row gives their general reading there; e.g. Hishām, Ibn Dhakwan, Shuʿbah,
  Ḥafṣ, Ḥamzah''s two and al-Kisāʾī''s two before a hamzah qatʿ maftūḥah.'
notes:
- 'Hamzat waṣl class: the case default sukūn for all fourteen follows the ''وأسكنها غيرهم'' wording of the rows on wafi 190-191 (أخي اشدد، ياليتني
  اتخذت، واصطنعتك، إن قومي، من بعدي); the exceptions are listed per word.'
- 'Class with lām al-taʿrīf: wafi 189 says Ḥamzah sukūn for all of them, while wafi 184 lists three that all fourteen open (بلغني الكبر، نعمتي
  التي، أروني الذين); kept as an exception entry. The same page''s idah 166 ''fourteen yāʾāt'' for Khalaf al-ʿĀshir opens them.'
- 'wafi 186-187 counts do not match the extracted words: the eight places of Nāfiʿ, Abū ʿAmr (seven words) and the four places of Nāfiʿ, Abū ʿAmr,
  Bazzī (three words). — re-read (wafi 186): Wafi 186 lists the eight places for Nāfiʿ and Abū ʿAmr: two in Yūsuf (إني أحدهما, إلي الآخر), حتى
  يأذن لي, ضيفي, يسر لي, من دوني, and اجعل لي آية in both آل عمران and مريم, which is one word in two places, so eight places are seven words.
  The four places (Nāfiʿ, Abū ʿAmr, Bazzī) are ولكني أراكم in Hūd and al-Aḥqāf, من تحتي, and إلي أراكم بخير: four places, three words.'
- 'wafi 187 عندي أولم: Bazzī and Qunbul both wujūh per ''ظاهر النظم''; the Wāfī itself notes this is the apparent reading of the verse.'
- 'Yaʿqūb: Ruways and Rawḥ differ at قل لعبادي الذين آمنوا (idah 165, 168), إن قومي اتخذوا (idah 164, 168) and يا عباد لا خوف (idah 164, 168);
  both are in the entries.'
- 'Khalaf al-ʿĀshir (idah 168-169): in the thirty yāʾāt without a hamzah the default is sukūn except محياي (opened) and يا عباد لا خوف (dropped).'
- 'In the ''not before a hamzah'' class wafi 184 and 191-192 give listed words only; no case default is stated for the fourteen. — re-read (wafi
  191, wafi 192): Wafi 191-192 (and 184) give no blanket case default, but for every one of the thirty places they name who opens the yāʾ and
  say the rest (''وأسكنها غيره'' / ''وسكن هذه الياءات غير حفص'') have sukūn. Exceptions are محياي (all but Qālūn open; Warsh both) and يا عبادي
  لا خوف (Shuʿbah opens; Ḥafṣ, Ḥamzah, Kisāʾī, Ibn Kathīr drop; others sākinah). So for the fourteen the unnamed default is sukūn, not ''opened''
  as the table has it. ومالي لا أعبد: Ḥamzah sukūn, the others open in waṣl (wafi 192), now in its entry.'
