# ya_idafa: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `questions`: for Eisa
# (a `policy` one is answered once for every table it covers, pipeline/open_sort.yaml); `gaps`: a page to
# re-read; `notes`: how a slot was read. Generated by `python3 -m pipeline.unify_merge`; edit by review,
# then regenerate.
