filled_notes:
- 'Agreed idghām cases (إذ before ذ, دال قد before ت د, تاء التأنيث before ت د ط, mithlayn): al-Īḍāḥ has no row for the six ruwāt of the Durrah
  (wafi 134 only); left empty.'
- 'Yaʿqūb (Ruways, Rawḥ): no row for لام هل وبل except هل ترى (idah 128), and none for the mithlayn; left empty. idah 69 says only ''يظهر فيما
  عداها مثلين أو متقاربين'' (how far it reaches is not clear).'
- 'Khalaf al-ʿĀshir (Isḥāq, Idrīs): لام هل وبل izhār only where Khalaf ʿan Ḥamzah idghāms (ت ث س, idah 128); the other letters are not stated;
  left empty.'
- 'wafi 136 rāʾ sākinah before lām: the rows state only Abū ʿAmr (Dūrī khulf, Sūsī idghām); no row for the others.'
- 'idah 129/130/132 ''كأصله'' rows for Abū Jaʿfar: written as izhār (aṣl Nāfiʿ) without splitting Qālūn and Warsh, since no row differs.'
notes:
- 'wafi 134 row on إذ before ذ: the extraction names the letters ''ذ ظ'' and its quote is cut off after ''نحو''; which letters it means is not
  settled. — re-read (wafi 134): Wafi 134 says all readers merge the dhāl of إذ into ذ (e.g. إذ ذهب) and into ظ (e.g. إذ ظلمتم). The quote is
  not cut off; the page names both letters, so the row covers ذ and ظ.'
- 'The letters of قد and of هل وبل that the rows do not name are written as ''the four / three other letters''; the rows give no names. — re-read
  (wafi 130, wafi 131, wafi 133): Wafi 130 (the extraction prints الذال as ''النال'') says the eight letters of دال قد are س ذ ض ظ ز ج ص ش; the
  table''s named cases are ض ظ and ذ ز, so the four others are س ج ص ش. Wafi 133 says the eight letters of هل وبل are ت ث ظ ز س ن ط ض; the table
  names ث س, ت, and ن ض, so the three others are ظ ز ط.'
- Abū Jaʿfar via asl for إذ before ت/د rows rests on idah 127 ('وقد وافق أصله في ذال إذ'); his قد and تاء rows are explicit izhār (idah 127);
  هل وبل izhār (idah 129).
- 'wafi 136: ''الباقون'' for عذت، فنبذتها، أورثتموها leaves Hishām out of the extracted readers; written as izhār with the rest. — re-read (wafi
  136): Wafi 136 names Ḥamzah, al-Kisāʾī and Abū ʿAmr for the idghām of the dhāl in عذت and فنبذتها, and Abū ʿAmr, Hishām, Ḥamzah, al-Kisāʾī for
  the thāʾ in أورثتموها; everyone else reads iẓhār. So Hishām is among ''الباقون'' (iẓhār) for عذت and فنبذتها, and is named for idghām in أورثتموها,
  which is how the table already has him.'
- 'wafi 135 ماليه هلك: both wujūh for all fourteen, in waṣl.'
- 'idah 135 فيغفر لمن يشاء: for Khalaf al-ʿĀshir only ''جزم الراء'' is stated, nothing on idghām. — re-read (idah 135): Idah 135 says Khalaf (al-ʿĀshir)
  agrees with his aṣl in jazm of the rāʾ in فيغفر and of the bāʾ in ويعذب, and in idghām of the bāʾ in the mīm. The page names idghām only for
  the bāʾ, and says nothing separate about the rāʾ before the lām; for it he follows his aṣl, i.e. Khalaf ʿan Ḥamzah, whose rāʾ-before-lām row
  (wafi 136) gives idghām only to Abū ʿAmr.'
- 'wafi 137 يعذب من يشاء: the book says Ibn Kathīr''s only reading by the naẓm and his aṣl is izhār (the table follows).'
- 'idah 131-132 أخذت/اتخذت: Ruways izhār only; Rawḥ, Abū Jaʿfar, Khalaf idghām; wafi 137 اتخذتم/أخذتم: Ḥafṣ, Bazzī, Qunbul izhār.'
- 'Khalaf ʿan Ḥamzah on بل طبع الله عليها: izhār ''قولا واحدا'' (wafi 134), Khallad has both (wafi 133).'
- 'Idah p.131 row on Ruways: ''أخذت'' (3 forms) and ''اتخذت'' (2 forms) are the book''s own wordings; merged into one entry with the Wāfī''s اتخذتم/أخذتم.'
