notes:
- 'Five parts, five cases, with their old wujūh ids kept (tashil, hadhf, ibdal_ya, ibdal_madd, ibdal_qasr, tashil_rawm_madd, tashil_rawm_qasr,
  tahqiq_idkhal, tashil_idkhal, ibdal). New ids: ibdal_tawassut, tashil_rawm_tawassut, ibdal_waw, naql_hadhf, ibdal_idgham, izhar, idgham, qalb_waw_idgham,
  kasr_ha, damm_ha.'
- 'Final case, Khalaf and Khallād (wafi 115): the three lengths of ibdāl to alif are qaṣr, tawassuṭ, madd; the reviewed profile row lists madd,
  qaṣr and tashīl with rawm only (madd, qaṣr) — tawassuṭ is added from wafi 115. The case-level list is the union of the final-hamzah readings;
  which applies to which kind of final hamzah is in the listed rows (after alif: three lengths; after a movable letter: ibdāl to the madd letter
  or tashīl with rawm, wafi 126; after a sākin sahīh/līn: naql then ḥadhf, wafi 112; after a sākin zāʾid wāw/yāʾ: ibdāl and idghām, wafi 115;
  after an original wāw/yāʾ: naql and ḥadhf, or ibdāl and idghām, wafi 125). The rows say rawm and ishmām are allowed in all cases except when
  ibdāl is to a madd letter (wafi 124; Hishām included), and after naql in المرء/ملء/دفء ishmām and rawm for the raised, rawm for the lowered
  (wafi 113). Hishām follows Ḥamzah in a final hamzah only (wafi 117, 126).'
- 'Final case: Hishām''s wujūh are the same as Khalaf''s and Khallād''s for the final hamzah (wafi 117 ''مثل حمزة''); wafi 126 gives all three
  the two wujūh ibdāl to a madd letter or tashīl with rawm as khulf.'
- 'Middle case, مستهزءون: wafi 121 says the ḥadhf is established from Ḥamzah (''ثابت''), while the reviewed profile row gives three wujūh (tashīl
  toward wāw, ibdāl yāʾ, ḥadhf) from al-Budūr p. 22 and Ghayth p. 31; the table keeps wafi 121 (ḥadhf only for those words) and the case-level
  wujūh list tashīl, ibdāl yāʾ, ibdāl wāw, ḥadhf; the profile''s ''three wujūh'' for this word are not resolved here. — answered: Eisa: the three
  wujūh (tashīl, ibdāl yāʾ, ḥadhf) are right.'
- 'Middle case: the profile row has no ibdal_waw; added because wafi 116 gives a pure wāw for a hamzah maftūḥah after ḍammah (يؤيد…). wafi 122:
  for the words with an inseparable prefix (يؤمن…) the book says only ''takhfīf'' of the hamzah, not naming tashīl; listed as tashīl. wafi 123
  هاؤم: tashīl with madd or qaṣr.'
- 'Prefix case (wafi 123): Khalaf and Khallād have taḥqīq (as the first of the word in reality) or tashīl/takhfīf (as in the middle in form);
  for وأمر, فأتنا, فأووا, الذي اؤتمن, ائتنا the book says ''ibdāl and taḥqīq'' (listed). Hishām: taḥqīq from the profile row (final only changes).'
- 'Sākin-hamzah case: Khalaf and Khallād ibdāl (wafi 110) only when the preceding letter is movable (wafi 111, two conditions); Hishām taḥqīq
  (profile; he changes only a final hamzah).'
- 'Isḥāq and Idrīs (idah 121): taḥqīq in every kind of waqf on a hamzah; no ''via asl'' since the row speaks of them.'
- 'Rasm-following waqf (wafi 118-120): some of the ahl al-adāʾ narrate from Ḥamzah that he followed the mushaf''s spelling (yāʾ, wāw, ḥadhf):
  words with a wāw-form after alif (شركاء, نشاء, الضعفاء, شفعاء, البلاء, دعاء, براء, جزاء), a wāw-form not after alif (يبدو, تفتأ, يتهيأ, أتوكأ,
  تظمأ, يدرأ, يعبأ, الملأ, ينشأ, نبأ) and a yāʾ-form after alif (تلقاء, إيتاء, آناء, وراء, نبأ المرسلين); a view of some shaykhs, so not in the
  table. — answered: options, off by default (Eisa)'
