# hamz_waqf: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `open`: questions
# for Eisa. Generated by `python3 -m pipeline.unify_merge`; edit by review, then regenerate.
category: hamz_waqf
what: Ḥamzah's and Hishām's stop on the hamzah (sākin, final, middle, after a prefix, two hamzahs, with rawm/ishmām); five parts, each a case
wujuh:
- id: tahqiq
  ar: تحقيق الهمزة
  en: the hamzah pronounced as in wasl
- id: tashil
  ar: تسهيل بين بين
  en: tashīl between (also takhfīf in the middle-hamzah case)
- id: hadhf
  ar: حذف الهمزة
  en: the hamzah dropped
- id: ibdal_ya
  ar: إبدال الهمزة ياء
  en: the hamzah turned into yāʾ
- id: ibdal_waw
  ar: إبدال الهمزة واوا
  en: the hamzah turned into wāw
- id: ibdal
  ar: إبدال الهمزة حرف مد
  en: the hamzah turned into a madd letter matching the vowel before it
- id: ibdal_madd
  ar: إبدال ألفا مع المد
  en: ibdāl into a madd letter with madd (long)
- id: ibdal_tawassut
  ar: إبدال ألفا مع التوسط
  en: ibdāl into a madd letter with tawassuṭ
- id: ibdal_qasr
  ar: إبدال ألفا مع القصر
  en: ibdāl into a madd letter with qaṣr
- id: tashil_rawm_madd
  ar: تسهيل بالروم مع المد
  en: tashīl with rawm and madd
- id: tashil_rawm_tawassut
  ar: تسهيل بالروم مع التوسط
  en: tashīl with rawm and tawassuṭ
- id: tashil_rawm_qasr
  ar: تسهيل بالروم مع القصر
  en: tashīl with rawm and qaṣr
- id: tahqiq_idkhal
  ar: تحقيق مع إدخال ألف
  en: taḥqīq with an alif inserted between the two hamzahs
- id: tashil_idkhal
  ar: تسهيل مع إدخال ألف
  en: tashīl with an alif inserted between the two hamzahs
- id: naql_hadhf
  ar: نقل حركة الهمز إلى الساكن قبله وحذفه
  en: the hamzah's vowel moved onto the sākin before it and the hamzah dropped
- id: ibdal_idgham
  ar: إبدال من جنس ما قبله وإدغامه
  en: ibdāl into the kind of the letter before it and merging into it
- id: izhar
  ar: إظهار الحرف المبدل
  en: the letter substituted for the hamzah kept apart
- id: idgham
  ar: إدغام الحرف المبدل فيما بعده
  en: the substituted letter merged into the one after it
- id: qalb_waw_idgham
  ar: قلب الواو ياء وإدغامها
  en: the substituted wāw turned into yāʾ and merged
- id: kasr_ha
  ar: كسر الهاء
  en: kasrah on the hāʾ (أنبئهم)
- id: damm_ha
  ar: ضم الهاء
  en: ḍammah on the hāʾ
