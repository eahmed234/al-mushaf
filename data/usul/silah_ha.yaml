# silah_ha: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `questions`: for Eisa
# (a `policy` one is answered once for every table it covers, pipeline/open_sort.yaml); `gaps`: a page to
# re-read; `notes`: how a slot was read. Generated by `python3 -m pipeline.unify_merge`; edit by review,
# then regenerate.
category: silah_ha
what: 'Hāʾ al-kināyah: its ṣilah, qaṣr and iskān, and the words read otherwise.'
wujuh:
- id: none
  ar: قصر الهاء / ترك الصلة
  en: 'no ṣilah: hāʾ with its vowel (qaṣr)'
- id: silah
  ar: صلة الهاء (إشباع)
  en: ṣilah (ishbāʿ), a wāw or yāʾ after the hāʾ
- id: sukun
  ar: إسكان الهاء
  en: sukūn of the hāʾ
- id: hamz_damm_qasr
  ar: همز ساكن مع ضم الهاء وقصرها
  en: sākin hamzah, ḍamm of the hāʾ, qaṣr (أرجئه)
- id: nohamz_kasr_qasr
  ar: ترك الهمز مع كسر الهاء وقصرها
  en: no hamzah, kasr of the hāʾ, qaṣr (أرجئه)
- id: hamz_kasr_qasr
  ar: همز ساكن مع كسر الهاء وقصرها
  en: sākin hamzah, kasr of the hāʾ, qaṣr (أرجئه)
- id: nohamz_silah
  ar: ترك الهمز مع صلة الهاء
  en: no hamzah, ṣilah (أرجئه)
- id: nohamz_sukun
  ar: ترك الهمز مع إسكان الهاء
  en: no hamzah, sukūn of the hāʾ (أرجئه)
- id: kasr_ha
  ar: كسر الهاء
  en: kasr of the hāʾ (أهله)
- id: hamz_damm_silah
  ar: همز ساكن مع ضم الهاء وصلتها
