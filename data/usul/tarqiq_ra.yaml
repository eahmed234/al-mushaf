open:
- 'Ibn Wardān, Ibn Jammāz: from the Durrah''s ''قرأ جميع الراءات واللامات مثل قراءة [قالون]'' (idah 146): given Qālūn''s reading in each case,
  via: model_qalun (Qālūn the stated model, not via aṣl), cite = idah 146 plus Qālūn''s pages. Ruways, Rawh and Ishaq, Idris: ''كأصله'' (idah
  147): Abū ʿAmr''s (al-Dūrī = al-Sūsī in every case here) and Khalaf ʿan Ḥamzah''s reading, via: asl.'
- The Durrah rows (idah 146-147) say only 'like Qālūn' and 'like his aṣl'; whether Yaʿqūb's two (and Khalaf's) differ on the khulf words (فرق،
  القطر، مصر) is not in the rows; they are given the model's/aṣl's own khulf.
- 'Case ''every rāʾ not under a condition'': wafi 170 ''اعمل بالتفخيم ... فيما عدا قواعد الترقيق'' for the fourteen; the profile rows repeat it
  for ''rest7'' (wafi 161).'
- 'Warsh''s cases (profile, wafi 161-162): a ḥarf istiʿlāʾ sākin stops the tarqīq; the other thirteen of the fourteen are given tafkhīm from the
  profile rows (wafi 161, 170), the rows of this category speak of Warsh only for the first two conditions.'
filled_notes:
- 'Warsh, rule exceptions without a stated reading: الخيرة، يرون، يردون، في ريب، مقنعى رموسهم (wafi 161) and الكفار رحماء، برشيد، بأمر ربك، بربوة،
  لرقيك (wafi 162) are named as excluded from Warsh''s tarqīq; the rows give them no reading of their own (برشيد، بأمر ربك، لرقيك are in the tafkhīm
  list at wafi 167).'
- 'Rawm (wafi 169-170): the fourteen ''as in waṣl'' is a statement, not a wajh; for Warsh the row (wafi 170) ''ووقفت بالروم لورش فإنك ترقق الراء''
  is given as tarqīq; whether it covers every rāʾ at a stop with rawm or only after a kasrah is not stated in the row.'
