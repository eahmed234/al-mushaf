  ar: القصر
  en: qaṣr, 1 alif (2 ḥarakāt)
- id: tawassut
  ar: التوسط
  en: tawassuṭ, 2 alifs (4 ḥarakāt)
- id: ishba
  ar: المد المشبع / الطول
  en: ṭūl / ishbāʿ, 3 alifs (6 ḥarakāt)
