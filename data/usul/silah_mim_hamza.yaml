notes:
- 'Qālūn: no silah_mim_hamza row names him as a reader; his sukūn-or-ṣilah choice comes from the reviewed profile rows (cite wafi 51), and wafi
  52 only mentions him in passing (''after Ibn Kathīr, Qālūn and Warsh'').'
- Warsh's ṣilah takes his munfaṣil length (ishbāʿ) (reviewed profile note on wafi 52); the length itself belongs to the madd table.
- 'Ibn Wardān / Ibn Jammāz: idah 57''s quote says ''before a mutaḥarrik'' and the row applies it to the hamzah; idah 57 is the page cited.'
- 'Ruways, Rawḥ, Isḥāq, Idrīs: only idah 58 (their aṣl leaves the ṣilah); sukūn is the aṣl''s reading, from wafi 52 (reviewed profile cite idah
  40-43).'
- 'The ten others (Abū ʿAmr''s two, Ibn ʿĀmir''s two, Shuʿbah, Ḥafṣ, Khalaf, Khallād, Abū l-Ḥārith, al-Dūrī): sukūn in waṣl, from wafi 52.'
