- id: tahqiq
  ar: تحقيق الهمزة
  en: the hamzah pronounced
- id: ibdal_waw
  ar: إبدال الهمزة واوا
  en: the hamzah turned into a pure wāw
- id: ibdal_ya
  ar: إبدال الهمزة ياء محضة
  en: the hamzah turned into a pure yāʾ
- id: ibdal_ya_maftuha
  ar: إبدال الهمزة ياء مفتوحة
  en: the hamzah turned into a yāʾ with fatḥah
- id: ibdal
  ar: الإبدال
  en: ibdāl (the book does not name the letter)
- id: ibdal_waw_idgham
  ar: إبدال الهمزة واوا مفتوحة وإدغام الواو قبلها فيها
  en: the hamzah turned into wāw and the preceding wāw merged into it
- id: ibdal_ya_idgham
  ar: إبدال الهمزة ياء وإدغام الياء قبلها فيها
  en: the hamzah turned into yāʾ and the preceding yāʾ merged into it
- id: hadhf_tashdid_zay
  ar: حذف الهمزة مع تشديد الزاي
  en: the hamzah dropped with the zāy doubled
- id: tashil
  ar: تسهيل الهمزة
  en: the hamzah eased
- id: tashil_thaniya
  ar: تسهيل الهمزة الثانية
  en: the second hamzah of the word eased
- id: ibdal_waw_sakina
  ar: إبدال الهمزة واوا ساكنة
  en: the hamzah turned into a sākin wāw
- id: hamz_sakina_for_waw
  ar: همزة ساكنة مكان الواو
  en: a sākin hamzah in place of the wāw
- id: tashil_madd
  ar: تسهيل بين بين مع المد
  en: tashīl between with madd
- id: tashil_qasr
  ar: تسهيل بين بين مع القصر
  en: tashīl between with qaṣr
- id: ibdal_ya_sakina
  ar: إبدال ياء ساكنة مع المد المشبع
