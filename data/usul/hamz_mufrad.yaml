open:
- 'wafi 99: Warsh does not turn it into wāw in فؤاد and سؤال (three conditions of the rule); idah 105 gives الفؤاد, فؤادك, بسؤال as exceptions
  for Abū Jaʿfar; the rows do not say what they read there.'
- 'idah 105: Abū Jaʿfar''s ibdāl of the hamzah maftūḥah after kasrah to a yāʾ maftūḥah applies ''in thirteen'' words; only قرئ is named in the
  row.'
- 'idah 107 موطئا: both Ibn Wardān and Ibn Jammaz have khulf (ibdāl or taḥqīq); the row does not name the letter of ibdāl nor give an order of
  preference.'
- 'idah 105 and 104: for يؤيد Ibn Jammaz has a pure wāw (idah 104) and Ibn Wardān taḥqīq (idah 105); Ibn Jammaz''s place in the fāʾ-after-ḍamm
  rule is the same wāw.'
- 'idah 117 عادا الأولى: Abū Jaʿfar has ''three wujūh like Qālūn'' with a sākin wāw in place of the hamzah; the three wujūh themselves are not
  in these rows. Qālūn (wafi 108): sākin hamzah in place of the wāw when he reads with naql (the other wujūh of Qālūn are in the lām-ta''rīf categories).'
- 'wafi 58 واللائى ينسن: Abū ʿAmr (al-Dūrī and al-Sūsī) have khulf: tashīl between (with madd or with qaṣr) or ibdāl to a sākin yāʾ with full
  madd; the row does not say which is preferred.'
- 'idah 114 التى: Ruways and Rawḥ taḥqīq of the hamzah wherever it occurs; idah 112: Abū Jaʿfar''s tashīl in أرأيت ''wherever and however it occurs''
  (not tied to a position).'
filled_notes:
- 'In the one case (hamzah maftūḥah as fāʾ after ḍammah) only Warsh (wafi 99) and Ibn Wardān/Ibn Jammaz (idah 105) are spoken of by the rows;
  the other seventeen are left empty, not filled with taḥqīq. The same for every listed word: only the ruwāt named by the row are listed.'
- 'wafi 102-103 يلتكم: the added hamzah is read taḥqīq by al-Dūrī, ibdāl to alif by al-Sūsī, dropped by the other twelve of al-Wāfī named; the
  Durrah rows say nothing (empty).'
