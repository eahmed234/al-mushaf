notes:
- 'Khalaf ʿan Ḥamzah: wafi 105 gives him a qalīl sakt with khulf; wafi 106 says "فلا يسكت على الساكن المفصول … لخلف ولا لخلاد" (no sakt for either).
  The two pages disagree; table lists both wujūh (sakt first, as the khulf row has it), unresolved. — answered: Eisa: wafi 105 defines the sakt;
  the categories are the mafṣūl ʿāmm (this table) and the khāṣ (ال، شيء: sakt_al). wafi 106: Khalaf sakt in the mafṣūl on the first madhhab, none
  on the second, so [sakt, none]; Khallād none on both.'
- 'Khallād: none (wafi 105, 106).'
- 'Ibn Wardān, Ibn Jammāz, Ruways, Rawḥ: idah 124 "كأصليهما"; the aṣl''s (Nāfiʿ, Abū ʿAmr) none comes from wafi 105 (profile cites wafi 105 for
  "the rest"). Isḥāq and Idrīs: idah 121 "ترك السكت على الساكن مطلقاً".'
- 'Idrīs: a sakt khulf on a sākin that is not a madd is recorded by the editor (al-Muṭṭawwiʿī, from al-Mubhij; idah 121-123); left out as an option,
  default none, as in sakt_al. — answered: kubrā version only (Eisa)'
- 'The other twelve of the Shāṭibiyyah: "none" is from the reviewed profile (wafi 105); the sakt_mafsul rows themselves speak of Khalaf and Khallād
  only.'
