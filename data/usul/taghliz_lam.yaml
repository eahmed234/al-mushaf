listed:
- words:
  - أفطال
  - طال عليهم
  - فصالا
  - يصالحا
  case: a fatḥah lām after ṣād, ṭāʾ or ẓāʾ
  ruwat:
    warsh:
    - taghliz
    - tarqiq
  note: 'the alif between the ṭāʾ/ṣād and the lām: some narrators taghlīẓ, some tarqīq'
  cite:
  - wafi 172
- words:
  - يوصل
  - فصل
  - وبطل
  - ظل
  - وفصل الخطاب
  case: a fatḥah lām after ṣād, ṭāʾ or ẓāʾ
  ruwat:
    warsh:
    - taghliz
    - tarqiq
  note: final lām at a stop; taghlīẓ is the stronger (أرجح)
  cite:
  - wafi 172
- words:
  - مصلى
  - يصلاها
  - يصلى
  - تصلى
  - لا يصلاها
  - سيصلى
  case: a fatḥah lām after ṣād, ṭāʾ or ẓāʾ
  ruwat:
    warsh:
    - taghliz
    - tarqiq
  note: taghlīẓ goes with fatḥ of the alif, tarqīq with taqlīl; not at a verse end
  cite:
  - wafi 172
- words:
  - صلى
  case: a fatḥah lām after ṣād, ṭāʾ or ẓāʾ
  ruwat:
    warsh:
    - tarqiq
  note: 'when the alif is at a verse end: tarqīq (with taqlīl) only'
  cite:
  - wafi 172
- words:
  - أفغير الله
  - ولذكر الله
  - ذكر الله
  case: lām of ٱللَّه after a kasrah
  ruwat:
    warsh:
    - taghliz
  note: after a muraqqaqah rāʾ, Warsh makes the lām full
  cite:
  - wafi 173
- words:
  - حتى نرى الله
  case: lām of ٱللَّه after a fatḥah or ḍammah
  ruwat:
    susi:
    - taghliz
    - tarqiq
  note: taghlīẓ only if he reads نرى with fatḥ; with imālah both
  cite:
  - wafi 173
