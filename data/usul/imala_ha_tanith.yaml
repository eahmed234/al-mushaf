filled_notes:
- 'Every case: al-Wāfī 158-160 speaks only of al-Kisāʾī (Abū l-Ḥārith, al-Dūrī); no row for the other twelve of the fourteen or for the six Durrah
  ruwāt, so they are left empty (wafi 158-160).'
options:
- id: kisai_all_letters
  about: hāʾ al-taʾnīth after every letter but the alif
  ruwat:
  - abul_harith
  - duri_kisai
  reads: imālah
  cite:
  - wafi 159
  view: ahl al-adāʾ
  default: 'off'
notes:
- 'Wafi 159: some ahl al-adāʾ made imālah for al-Kisāʾī after every letter except the alif; a view the book reports, not put in the table. — answered:
  options, off by default (Eisa)'
- 'Wafi 158: the row names nine letters (ح ق ض ا ط ع ص خ ظ) while the book calls them ''ten''; the tenth is not in the rows. — re-read (wafi 158,
  wafi 160): Wafi 158 lists the ten excepted letters by the verse ''حق ضغاط عص خطا'', and its commentary then names nine with examples (ح ق ض
  ا ط ع ص خ ظ). The verse word ضغاط contains غ, which the commentary''s list leaves out, so the tenth is غ (the extracted verse reads ''خطا'',
  so ظ is attested only through the commentary''s list).'
status: merged 2026-11-26
