filled_notes:
- 'Rest of the fourteen (taḥqīq) and Warsh''s taḥqīq in the ʿayn and lām cases come from the reviewed profile rows (wafi 98-101: Warsh ''only
  a hamzah that is fāʾ al-fiʿl''); no row states them. Isḥāq and Idrīs: from the aṣl (profile, idah 40-43), no row.'
- 'Ibn Wardān/Ibn Jammaz (idah 103): in wasl, where the hamzah''s neighbour sākin is moved (e.g. يشأ), taḥqīq; on stopping there they return to
  ibdāl (idah 103, waqf row); and where the hamzah was originally moving and is sākin only by waqf (الملأ, امرئ, شاطئ, لؤلؤ), taḥqīq. Readings
  of other words in those two conditions are not stated.'
notes:
- The books give the fāʾ/ʿayn/lām split only through Warsh's rule (fāʾ only, wafi 99) and the examples; Ibn Wardān/Ibn Jammaz and al-Sūsī are
  said to apply to every sākin hamzah, so the three cases carry the same reading for them.
- 'al-Sūsī: the rows list the exceptions of kind jazm (wafi 100) and bināʾ (wafi 100) and the single words تؤوى/تؤويه (wafi 101), رئيا, مؤصدة,
  بارئكم; the ''heavier'' and ''ambiguous'' kinds of the profile cond are the same words, not extra rows.'
- 'يأجوج ومأجوج (idah 102): Ruways and Rawḥ read ibdāl although their rule is taḥqīq; the reviewed profile row calls these farsh. Listed here
  because the row is in this category.'
- 'Ibn Wardān/Ibn Jammaz on لؤلؤ: taḥqīq when sākin only by waqf (idah 103); Shuʿbah ibdāl in the same word (wafi 102) — different conditions
  (waqf vs wasl), kept apart; case ʿayn for Shuʿbah is assumed from the word.'
