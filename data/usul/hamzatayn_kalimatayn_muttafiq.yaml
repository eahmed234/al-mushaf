# hamzatayn_kalimatayn_muttafiq: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `questions`: for Eisa
# (a `policy` one is answered once for every table it covers, pipeline/open_sort.yaml); `gaps`: a page to
# re-read; `notes`: how a slot was read. Generated by `python3 -m pipeline.unify_merge`; edit by review,
# then regenerate.
category: hamzatayn_kalimatayn_muttafiq
what: two hamzahs at the meeting of two words, both with the same vowel
wujuh:
- id: tahqiq
  ar: تحقيق الهمزتين
  en: both hamzahs fully pronounced
- id: isqat_ula
  ar: إسقاط الهمزة الأولى
  en: the first hamzah dropped
- id: tashil_ula
  ar: تسهيل الأولى بين بين
  en: the first hamzah eased between
- id: ibdal_ula_waw_idgham
  ar: إبدال الأولى واوا وإدغام الواو قبلها فيها
  en: the first hamzah turned into wāw and the preceding wāw merged into it
- id: tashil_thaniya
  ar: تسهيل الثانية بين بين
  en: the second hamzah eased between
- id: ibdal_thaniya
  ar: إبدال الثانية حرف مد مجانسا لحركة الأولى
  en: the second hamzah turned into a madd letter matching the vowel of the first
- id: ibdal_thaniya_ya
  ar: إبدال الثانية ياء مكسورة
  en: the second hamzah turned into a kasrah yāʾ
