filled_notes:
- 'Ḥafṣ is in no row for أعجمي (wafi 85): the rows name the Kūfī group of Shuʿbah, Ḥamzah, al-Kisāʾī (taḥqīq), Hishām (first dropped), and Nāfiʿ,
  Ibn Kathīr, Abū ʿAmr, Ibn Dhakwān (first pronounced, second eased); Ḥafṣ is not listed in the table for this word.'
- 'Hishām, second maḍmūmah (wafi 90): the row gives only the khulf of idkhāl (with or without) for Hishām, Abū ʿAmr (al-Dūrī, al-Sūsī), and no
  idkhāl khulf for Qālūn; it does not say whether Hishām reads the second hamzah with taḥqīq or tashīl; Hishām is left empty in this case. For
  al-Dūrī and al-Sūsī the table gives tashīl (wafi 84) with idkhāl, then without; the khulf is only on the idkhāl.'
- 'أئمة (wafi 89, idah 88): Hishām has idkhāl and taḥqīq or not; Nāfiʿ, Ibn Kathīr, Abū ʿAmr have tashīl, the rest taḥqīq; Abū Jaʿfar''s أيمةَ
  is said to be as his three types. Rows do not say whether Qālūn, al-Dūrī, al-Sūsī insert the alif in this word, so no reading is listed (ruwat
  left empty).'
- 'Case ''sākinah second hamzah'' (wafi 103): the one row speaks of all fourteen; no Durrah row (six empty). Case ''hamzat al-waṣl'' (wafi 87-88):
  no Durrah row (six empty); wafi 88 says the ibdāl with madd is better for all (أولى), listed first; wafi 88 also says those with idkhāl do not
  insert it in these words.'
- 'Repeated istifhām (idah 92-94, rows labelled istifham_mukarrar) and هأنتم (idah 113-114, haa_antum): the wujūh are the book''s own words; the
  fourteen of al-Wāfī have no row in this category for them (empty); Isḥāq and Idrīs are ''كأصله'' (idah 94, Khalaf ʿan Ḥamzah) but the aṣl''s
  reading is not in the rows (empty).'
order_exception: 'Warsh, second hamzah maftūḥah: al-Wāfī''s verse names the ibdāl (Egyptians) before the tashīl (Baghdādīs, wafi 84), but the
  reviewed table and al-Budūr (budur 20: ''الأول مثل المكي والثاني إبدالها'') put tashīl first; tashīl first (Eisa 2026-11-26)'
notes:
- 'Hishām, second maftūḥah (wafi 84): the row gives tashīl or taḥqīq; the idkhāl comes from wafi 89 (idkhāl before maftūḥah and maksūrah for Qālūn,
  Abū ʿAmr, Hishām) and agrees with the reviewed profile row, which gives [taḥqīq+idkhāl, tashīl+idkhāl].'
- 'Hishām, second maksūrah: wafi 89 gives taḥqīq with or without idkhāl; the reviewed profile row (wafi 84) gives taḥqīq+idkhāl and tashīl+idkhāl
  for him. The table keeps wafi 89. The seven words with ''no khulf'' idkhāl (wafi 89) include أتنكم لتكفرون, while the same page gives Hishām
  two wujūh (tashīl, taḥqīq) for the Fuṣṣilat word; both are listed as the rows say, not resolved. — answered: al-Budūr (Eisa: check al-Budūr):
  Hishām taḥqīq with and without idkhāl (budur 134, 166, 236, 265, 269), idkhāl only in the seven places (budur 120, 121, 238, 245); in Fuṣṣilat
  idkhāl with tashīl or taḥqīq, tashīl first (budur 282). The table follows.'
- 'Warsh, second maftūḥah (wafi 84): the Egyptians narrate ibdāl to alif, the Baghdādīs tashīl; the table orders tashīl, ibdāl as in the reviewed
  profile row; the book states no preference. — answered: the book''s first-listed wajh is the default (Eisa); every table already follows it
  except Warsh''s two hamzahs in one word, tashīl first (Eisa confirmed): see `order_exception`'
- 'ءالهتنا and آمنتم (wafi 88): those with idkhāl (Qālūn, Abū ʿAmr, Hishām) do not insert the alif in these words (the rows say ''لا إدخال'');
  for ءالهتنا no other reading is stated for the fourteen, only Abū Jaʿfar''s tashīl without idkhāl (idah 89).'
- 'Ḥafṣ for أن يؤتى أحد and أن كان ذا مال: wafi 86 gives ''one hamzah'' to the rest; the Durrah rows say nothing on أن يؤتى أحد, so no Durrah
  reading is listed for it; Isḥāq and Idrīs read one hamzah in أن كان ذا مال ''against their riwāyah'' (idah 90-91) while Khalaf ʿan Ḥamzah reads
  two (wafi 86); not a disagreement of rows, kept as stated.'
- 'Isḥāq and Idrīs for أذهبتم: ''كأصله'' (idah 91) → the aṣl Khalaf''s one hamzah (wafi 85); marked as listed, not via asl, since the aṣl''s reading
  comes from another page. — re-read (idah 93, idah 94): For Yaʿqūb''s Naml (أإذا كنا ترابا وآباؤنا أإنا) idah 93 says istifhām in both words,
  with the second hamzah eased and no alif for Ruways and pronounced (taḥqīq) with no alif for Rawḥ. Idah 94 repeats that Naml is istifhām in
  both. (The gap line itself concerns Isḥāq/Idrīs أذهبتم, a different note; this change is for Naml as tasked.)'
- 'Yaʿqūb''s Naml (idah 93): Ruways tashīl and Rawḥ taḥqīq of the second hamzah of أبنا, without idkhāl (idah 93) are not put in the table (only
  the istifhām/khabar pattern is).'
- 'Ruways in الأعراف وطه والشعراء (idah 89): khabar with one hamzah, in the listed آمنتم; Ibn Wardān/Ibn Jammaz there tashīl without idkhāl (idah
  89).'
- 'idah 90: for أعنك لأنت يوسف the rest of Yaʿqūb and Khalaf read as their aṣl (istifhām), as in their case reading.'
