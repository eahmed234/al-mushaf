# hamzatayn: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `questions`: for Eisa
# (a `policy` one is answered once for every table it covers, pipeline/open_sort.yaml); `gaps`: a page to
# re-read; `notes`: how a slot was read. Generated by `python3 -m pipeline.unify_merge`; edit by review,
# then regenerate.
category: hamzatayn
what: two hamzahs in one word (second maftūḥah / maksūrah / maḍmūmah / sākinah), with hamzat al-waṣl after istifhām, istifhām/ikhbār and the repeated
  istifhām (listed words)
wujuh:
- id: tahqiq
  ar: تحقيق الهمزة الثانية
  en: the second hamzah fully pronounced, no alif between
- id: tashil
  ar: تسهيل الثانية بين بين
  en: the second hamzah eased between, no alif between
- id: tashil_idkhal
  ar: تسهيل الثانية مع إدخال ألف
  en: the second hamzah eased, with an alif inserted between the two
- id: tahqiq_idkhal
  ar: تحقيق الثانية مع إدخال ألف
  en: the second hamzah pronounced, with an alif inserted between
- id: ibdal
  ar: إبدال الثانية ألفا
  en: the second hamzah turned into an alif
- id: single_hamza
  ar: همزة واحدة
  en: one hamzah only (the khabar reading, no istifhām hamzah)
- id: isqat_ula
  ar: إسقاط الأولى وتحقيق الثانية
  en: the first hamzah dropped, the second pronounced
- id: ibdal_ula_waw
  ar: إبدال الأولى واوا وتسهيل الثانية
  en: the first hamzah turned into wāw, the second eased
- id: wasl_ibdal_alif
  ar: إبدال همزة الوصل ألفا مع المد المشبع
  en: the hamzat al-waṣl turned into an alif with full madd
- id: wasl_tashil
  ar: تسهيل همزة الوصل بين بين
  en: the hamzat al-waṣl eased between
- id: tashil_alif
  ar: التسهيل مع إثبات الألف
  en: tashīl with the alif kept (هأنتم)
- id: ikhbar_istifham
  ar: الإخبار في الأول والاستفهام في الثاني
  en: khabar in the first of the repeated pair, istifhām in the second
- id: istifham_ikhbar
  ar: الاستفهام في الأول والإخبار في الثاني
  en: istifhām in the first, khabar in the second
- id: istifham_istifham
  ar: الاستفهام في الأول والثاني معا
  en: istifhām in both
