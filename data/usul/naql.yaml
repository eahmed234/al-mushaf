open:
- 'idah 117, "من أجل": the quote ("كما لا يدخل فيه نقل أبي جعفر") is unclear and the row''s place is "place", so whether both of Abū Jaʿfar''s
  ruwāt do naql there is unsettled; idah 119 says Ibn Jammāz reads "في جميع ذلك" with taḥqīq, which may conflict with this and with his naql in
  ردءا (idah 119).'
- The last listed item (ماليه هلك) is idghām of the hāʾ, not naql; the row sits in this category (wafi 110). The wujūh izhar and idghām are for
  all fourteen ("سائر القراء") and Ḥafṣ is not separated.
- 'wafi 107: the ten who read عاداً الأولى without naql (Hishām, Ibn Dhakwān, Bazzī, Qunbul, Shuʿbah, Ḥafṣ, Khalaf, Khallād, Abū l-Ḥārith, al-Dūrī
  ʿan al-Kisāʾī) are the case''s default, so not repeated.'
- Abū Jaʿfar's aṣl is Nāfiʿ, who has naql in ردءا and آلآن, so the Durrah rows agree with the aṣl there.
filled_notes:
- The general case (waṣl) for the six of the Durrah rests on the reviewed profile (idah 118-120) and on idah 119 ("بالتحقيق على الأصل", "كابن
  جماز موافقة لأصليهما"); no row states a general none for Ibn Wardān, so it is the listed words only that are his naql.
- Case 2 is stated only for Khalaf ʿan Ḥamzah and Khallād (some narrators naql, some taḥqīq; Khallād "only" these two, wafi 105-106); the other
  twelve and the six of the Durrah have no row for waqf.
- Case 3 (wafi 108) is stated for the fourteen only; "jāʾizān li-jamīʿ al-qurrāʾ". Nothing for the six of the Durrah; also the book says nothing
  there about whether the six have an أل with transferred hamzah.
