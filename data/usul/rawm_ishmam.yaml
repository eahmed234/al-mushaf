listed: []
open:
- Wafi 174 calls rawm/ishmām a 'ṭarīq jamīl' for Abū ʿAmr and the Kūfīs (Dūrī Abī ʿAmr, Sūsī, Shuʿbah, Ḥafṣ, Khalaf, Khallād, Abū l-Ḥārith, al-Dūrī)
  and says most ahl al-adāʾ take it, as istiḥbāb, for the others (Qālūn, Warsh, al-Bazzī, Qunbul, Hishām, Ibn Dhakwān); whether this ranks the
  wujūh is not settled by the rows (wafi 174).
- 'Wafi 176: all fourteen are listed with khulf over sukūn/ishmām/rawm on a ḍamm and over sukūn/rawm on a kasr; the rows do not say which each
  rāwī prefers.'
- Wafi 177 names 'the three places' for the second case without the rows saying which three; the rows gloss them as hāʾ al-taʾnīth, mīm al-jamʿ
  and the ʿāriḍ ḥarakah.
- The Durrah rows say nothing about rawm and ishmām.
