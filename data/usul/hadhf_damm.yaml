open:
- 'idah 108: the first row''s wording has the ḥadhf ''with ḍamm of what precedes'' (the vowel before the dropped hamzah); idah 110 المنشئون repeats
  it for Ibn Jammāz; not a separate wajh here.'
- 'idah 110 المنشئون: Ibn Wardān has two wujūh (ḥadhf and ithbāt), Ibn Jammāz only ḥadhf (no khulf).'
filled_notes:
- The readings of the 14 of al-Wāfī and of Ruways, Rawḥ, Isḥāq, Idrīs (taḥqīq) come only from the reviewed profile rows (wafi 98-103 states no
  such rule in bāb al-hamz al-mufrad; idah 109 n. 1 for the four); no row of the books speaks of them.
- 'idah 108-109: for Ibn Wardān and Ibn Jammāz the ḥadhf of the three other hamzah positions (maḍmūmah after fatḥah, maftūḥah after fatḥah, maksūrah
  after kasrah) is stated only for the named words, so they are in `listed`, not cases; the readings of other words with those positions are not
  stated.'
