# hamzatayn_kalimatayn_mukhtalif: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `questions`: for Eisa
# (a `policy` one is answered once for every table it covers, pipeline/open_sort.yaml); `gaps`: a page to
# re-read; `notes`: how a slot was read. Generated by `python3 -m pipeline.unify_merge`; edit by review,
# then regenerate.
category: hamzatayn_kalimatayn_mukhtalif
what: two hamzahs at the meeting of two words with different vowels (five darbs)
wujuh:
- id: tahqiq
  ar: تحقيق الهمزتين
  en: both hamzahs fully pronounced
- id: tashil_ya
  ar: تسهيل الثانية بين الهمزة والياء
  en: the second hamzah eased between hamzah and yāʾ
- id: tashil_waw
  ar: تسهيل الثانية بين الهمزة والواو
  en: the second hamzah eased between hamzah and wāw
- id: ibdal_waw
  ar: إبدال الثانية واوا محضة
  en: the second hamzah turned into a pure wāw
- id: ibdal_ya
  ar: إبدال الثانية ياء محضة
  en: the second hamzah turned into a pure yāʾ
