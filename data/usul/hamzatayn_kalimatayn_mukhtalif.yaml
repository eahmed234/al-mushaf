notes:
- 'idah 98: for Ibn Wardān, Ibn Jammāz and Ruways the row says ''كأصله في الأقسام الخمسة'' and that the nāẓim omitted Abū Jaʿfar and Ruways in
  the mukhtalifatayn, yet the same page then states each of the five darbs explicitly; the table uses the explicit statements (not marked via
  asl) and does not decide whether they equal Nāfiʿ''s/Abū ʿAmr''s.'
- 'wafi 96 darb 5 and idah 98 darb 5: two wujūh (tashīl like yāʾ, or pure ibdāl to wāw) as khulf for all six of al-Wāfī and the three of al-Īḍāḥ;
  no order of preference beyond listing tashīl first. — answered: the book''s first-listed wajh is the default (Eisa); every table already follows
  it except Warsh''s two hamzahs in one word, kept tashīl first: see `order_exception`'
- 'Isḥāq and Idrīs (idah 99): taḥqīq of the muttafiqatayn and mukhtalifatayn as their aṣl Khalaf''s; marked via aṣl.'
