filled_notes:
- 'The rest eight of al-Wāfī (Hishām … al-Dūrī al-Kisāʾī) read taḥqīq in the five darbs: no row of wafi 97 says it for the wasl case in so many
  words (the row says only that the seven agree on taḥqīq of the first hamzah, and taḥqīq of the second when one stops on the first); the table
  follows the reviewed profile row (wafi 97).'
- 'Durrah ruwāt for the waqf case: no row of al-Īḍāḥ; Ibn Wardān, Ibn Jammāz, Ruways left empty. Rawḥ and the Khalaf pair are filled from their
  general statements (idah 98, 99), not from a waqf row.'
