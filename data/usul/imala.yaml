filled_notes:
- 'Words excluded from a rule by the book with no reading of their own in the rows: الحياة مناة (wafi 140), همساً ضنكا نسفاً علماً ظلماً عزماً
  (wafi 146), أجاءها أزاغ (wafi 150), تراءت الفئتان (wafi 147), ونمارق الحواريين تمار (wafi 151).'
- 'The named words with no general rule (last case) have no case-level reading: every rāwī is empty there, the words are in `listed`.'
- 'Ruways, Rawh, Ibn Wardān, Ibn Jammāz for imala_alif_tanith and imala_ras_ay: Ibn Wardān/Ibn Jammāz fatḥ is ''فتح جميع باب الإمالة'' (idah 144),
  Ruways/Rawh fatḥ is ''the alifs imāled for Abū ʿAmr, kubrā or ṣughrā'' (idah 143); the other eight and Ishaq/Idris are left empty in these two
  cases (no row).'
- 'case imala_alif_tanith: no row speaks of qalun, warsh, bazzi, qunbul, hisham, ibn_dhakwan, shuba, hafs, ishaq, idris (left empty; idah 143,
  idah 144, wafi 141, wafi 149)'
- 'case imala_ras_ay: no row speaks of qalun, bazzi, qunbul, hisham, ibn_dhakwan, shuba, hafs, ishaq, idris (left empty; idah 143, idah 144, wafi
  146, wafi 148, wafi 149)'
- 'case named words with no general rule: no row speaks of qalun, warsh, bazzi, qunbul, duri_abuamr, susi, hisham, ibn_dhakwan, shuba, hafs, khalaf_an_hamzah,
  khallad, abul_harith, duri_kisai, ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; no cite)'
notes:
- 'Ishaq, Idris, imala_ra: fatḥ is the reviewed profile''s reading (idah 142, not a row page); the rows only give fatḥ at القهار and البوار (idah
  140) and imālah between two rāʾs (idah 141); the profile''s note says the القهار/البوار fatḥ differs from his riwāyah.'
- 'Ishaq, Idris at imala_kafirin, imala_nas, imala_ya, imala_ya_ra: via aṣl from the profile (cite idah 40-43, not a row page) except imala_ya
  where the row is idah 143 (''كأصله''); the aṣl is Khalaf ʿan Ḥamzah (this table: imālah for dhawāt al-yāʾ and dhawāt al-rāʾ, fatḥ for كافرين
  and الناس).'
- 'imala_nas: the profile note says the verse reads as khulf for Abū ʿAmr; al-Wāfī gives imālah to al-Dūrī and fatḥ to al-Sūsī ''by the ṭarīq''
  (wafi 154).'
- 'imala_ya, Abū ʿAmr (al-Dūrī, al-Sūsī): the profile gives fatḥ with the cond ''taqlīl in fuʿlā/faʿlā/fiʿlā forms and the ruʾūs al-āy of the
  eleven sūrahs; his imālah is in dhawāt al-rāʾ''; those are the cases imala_alif_tanith, imala_ras_ay and imala_ya_ra; the rows give no other
  reading of his for dhawāt al-yāʾ in general (wafi 149).'
- 'imala_ya, Warsh: fatḥ and taqlīl (wafi 148); the profile''s cond is ''after rāʾ: taqlīl only; ruʾūs al-āy: taqlīl only, unless with ـهَا''
  (cases imala_ya_ra, imala_ras_ay).'
- The thirteen/ten ruwāt marked 'rest' in the profile rows (fatḥ in imala_ra, imala_kafirin, imala_nas, imala_ya, imala_ya_ra, imala_jaa_shaa,
  imala_zad, imala_fiil, imala_duri_kisai) are given fatḥ from the profile rows, not from this category's rows.
- 'Ruways and Rawh at imala_ya (idah 143): fatḥ in ''the alifs Abū ʿAmr imāles'' except أعمى (the first in al-Isrāʾ); the rows do not repeat it
  for each case, the profile''s ''idah 143-144'' is used for the others.'
- 'المحراب for Ibn Dhakwān: khulf at wafi 154 and ''imālah only'' for المحراب in the jarr at wafi 155; both are in `listed`.'
- 'أنصارى for al-Dūrī ʿan al-Kisāʾī: no imālah in ''من أنصارى'' (wafi 152) but imālah listed for أنصارى at wafi 153; the extracted rows do not
  say which place. — re-read (wafi 152, wafi 153, wafi 154): Wafi 152 gives من أنصارى as an example of the general rule that the alif before a
  rāʾ with an ʿāriḍ kasrah is not imāled. Wafi 153-154 then lists أنصارى among the words al-Dūrī ʿan al-Kisāʾī alone imāles, naming ''من أنصارى
  إلى الله'' in Āl ʿImrān and al-Ṣaff. So 152 is the general rule and 153-154 the specific exception for al-Dūrī ʿan al-Kisāʾī.'
- 'Hafs: imālah only at مجراها in the rows (wafi 147).'
