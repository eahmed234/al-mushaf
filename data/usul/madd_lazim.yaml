filled_notes:
- 'The Durrah: one row, idah 85 ("كأصولهم في المد اللازم بجميع أنواعه"); every case except case 5 is filled with the aṣl''s wujūh (via asl), which
  all agree between the aṣl''s two ruwāt. Case 5 (two-letter letters, ألف) is not lāzim and the row does not reach it: left empty.'
notes:
- 'Lengths: ʿayn "4 ḥarakāt" = tawassuṭ (2 alifs) or 6 = ishbāʿ (3 alifs) (wafi 81); no fractions. For the others the rows say "المد المشبع ست
  حركات".'
- 'Abū Jaʿfar''s ruwāt on آلآن (first alif) and on الم أحسب الناس: their aṣl is Nāfiʿ, whose two ruwāt differ from case 1/2 in these words (Qālūn
  and Warsh above); the rows do not say which Ibn Wardān and Ibn Jammāz follow, so the listed words are not extended to them. — answered: al-Budūr:
  آلآن: Ibn Wardān reads like Qālūn, with naql, so ishbāʿ or qaṣr (budur 145-146); Ibn Jammāz has no naql (idah 119), ishbāʿ. الم أحسب: Abū Jaʿfar
  makes sakt on the letters, so no naql, ishbāʿ (budur 244).'
- 'Case 1: the rows list the words as examples only (الضالين, الطامة, الصاخة, وحاجه قومه, آلله خير, ص, ق, ن); the book names no exceptions in
  this category.'
- 'Case 4 quote ("المد المشبع نظراً …") is cut off in the row; the second wajh is qaṣr per the row''s tag only. — re-read (wafi 80, wafi 81):
  Wafi 80-81 say that for الم الله in waṣl, where the mīm gets a fatḥah, two wujūh are allowed for all the readers: the full ishbāʿ out of respect
  for the original sākin, and qaṣr because the mīm''s vowel is incidental. So the second wajh is qaṣr, stated in words, not only by the row''s
  tag.'
- 'wafi 80: "ميم الم" before a transferred hamzah is Warsh''s only (listed); the other thirteen are not mentioned.'
