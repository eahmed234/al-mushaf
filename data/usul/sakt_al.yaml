questions:
- id: sakt_al#2
  policy: footnotes
  from: 'Idrīs: the editor records a sakt khulf for a sākin that is not a madd (al-Muṭṭawwiʿī, from al-Mubhij, which needs ishbāʿ of the muttaṣil,
    idah 123); the Durrah says "والسكت أهملا" and the shārḥ and most take none (profile, idah 121-123). Table: none; the sakt is an option here,
    default none.'
notes:
- 'wafi 106 puts Khallād with Khalaf on the sakt of both (the row says sakt); the reviewed profile gives Khallād two wujūh (sakt and none) with
  the same page. Table follows the row; the profile''s second wajh is left here. — re-read (wafi 106): wafi 106: Khallād has no sakt on the first
  route and sakt on ال and شيء on the second, so the reviewed table''s two wujūh [sakt, none] are right in both words.'
- 'wafi 105-106: Khalaf''s sakt on لام التعريف is "قليل"; the row does not separate the two words for Khallād. — re-read (wafi 105, wafi 106):
  Wafi 106 gives Khallād no sakt at all on the first route (Abū al-Fatḥ) and sakt on ال and شيء/شيئا only on the second route (Ibn Ghalbūn), with
  no sakt on the separated sākin on either; so he has khulf in both words together. Khalaf has sakt on ال and شيء on both routes (the ''قليل''
  is the shortness of the sakt).'
- 'Abū Jaʿfar''s and Yaʿqūb''s ruwāt: idah 124 "كأصليهما" (a sakt_mafsul row); their aṣl, Nāfiʿ and Abū ʿAmr, have none, which the table gives.
  The Durrah rows speak of the mafṣūl; none has a row for lām al-taʿrīf or شيء, and the reviewed profile cites idah 121-123 for Isḥāq and Idrīs.'
