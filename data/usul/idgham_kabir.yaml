# idgham_kabir: one rule for all twenty ruwāt (the Shāṭibiyyah and the Durrah), from al-Wāfī and al-Īḍāḥ's
# uṣūl chapters, unified 2026-11-26 (pipeline/prompt_unify.md). Each slot cites its page; `via`:
# asl / asl_unstated = the Durrah rāwī reads as his aṣl (al-Īḍāḥ pp. 40-43); as_hafs = no row states
# it, read as Ḥafṣ (Eisa 2026-11-26); as_wasl = stops as in his waṣl; reviewed = kept from the
# reviewed profile table where a fresh reading disagreed (see `disagreements`). `questions`: for Eisa
# (a `policy` one is answered once for every table it covers, pipeline/open_sort.yaml); `gaps`: a page to
# re-read; `notes`: how a slot was read. Generated by `python3 -m pipeline.unify_merge`; edit by review,
# then regenerate.
category: idgham_kabir
what: 'idghām kabīr: al-Sūsī''s merging (and Yaʿqūb''s places in al-Īḍāḥ), rawm/ishmām and the madd before it'
wujuh:
- id: izhar
  ar: الإظهار
  en: iẓhār
- id: idgham
  ar: الإدغام الكبير
  en: idghām kabīr
- id: ikhfa_rawm
  ar: الإخفاء (الروم) بعد ساكن صحيح
  en: ikhfāʾ (rawm) after a sākin ṣaḥīḥ
- id: rawm
  ar: الروم
  en: rawm of the mudgham's vowel
- id: ishmam
  ar: الإشمام
  en: ishmām of the mudgham's damma
- id: ikhfa_mim
  ar: إسكان الميم وإخفاؤها
  en: mīm made sākin and ikhfāʾ before bāʾ
- id: qasr
  ar: القصر
  en: qaṣr
- id: tawassut
  ar: التوسط
  en: tawassuṭ
- id: ishba
  ar: المد
  en: madd (ṭūl)
- id: idgham_ishmam
  ar: الإدغام مع الإشمام
  en: idghām with ishmām
- id: ikhtilas
  ar: الإخفاء (الاختلاس)
  en: ikhfāʾ of the vowel (ikhtilās)
