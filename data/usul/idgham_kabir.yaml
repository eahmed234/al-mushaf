filled_notes:
- Cases 5-9 are stated for al-Sūsī only; every other rāwī is empty because the rows do not speak of them (the rawm/ishmām, madd and mīm rules
  are his).
- 'Case 6 (madd before the mudgham): al-Sūsī has ṭūl, tawassuṭ, qaṣr (wafi 66, and wafi 80 for a madd before a sukūn arising from idghām: قال
  لهم, الرحيم ملك, يقول ربنا). Lengths not stated; no fractions. Khulf; book''s order ṭūl, tawassuṭ, qaṣr is kept.'
notes:
- 'Every case is stated for al-Sūsī or Yaʿqūb''s places only. The other twelve of the Shāṭibiyyah and al-Dūrī: iẓhār (wafi 53, "ليس له من طريق
  النظم وأصله إلا الإظهار"; the words "من طريق النظم" leave other routes outside this book).'
- 'Cases 1-4: Ibn Wardān, Ibn Jammāz, Isḥāq, Idrīs are iẓhār through their aṣl (Nāfiʿ; Khalaf ʿan Ḥamzah) from the reviewed profile (idah 40-43),
  not a row of this category; idah 66 only says Yaʿqūb and Khalaf follow their aṣl on تأمنا. Rawḥ''s general iẓhār is from the profile (idah 62)
  and Ruways'' from idah 65 ("فليس له فيها إلا الإظهار").'
- 'تأمنا: Ibn Wardān and Ibn Jammāz merge the nūn (idah 65); for Ruways, Rawḥ, Isḥāq, Idrīs idah 66 says "كأصله". What the aṣl (Abū ʿAmr; Khalaf
  ʿan Ḥamzah) reads is not given in these rows, so they are not listed. — answered: Eisa: ishmām the default; Abū Jaʿfar has no option, idghām
  only (idah 65).'
- 'تتمارى, ثم تتفكروا, أتمدونن (idah 66-67): the rows give Ruways (and Rawḥ for the first and third) as merging in waṣl; Isḥāq, Idrīs, Ibn Wardān,
  Ibn Jammāz read iẓhār, which is the case default, so are not repeated.'
- 'The row for جعل, لا قبل لهم بها, وأنه هو (idah 63) has its words split oddly in the extraction (جَعَلَ in all places of al-Naḥl per the profile;
  "لَّا قِبَلَ هُم بِمَا"); listed as the row has them. — re-read (idah 63, idah 64): Idah 63-64 gives Ruways idghām/iẓhār khulf in three groups:
  جَعَلَ in all eight places of al-Naḥl (each as جَعَلَ لَكُم ...), قبل in al-Naml 27:37 (printed ''لَّا قِبَلَ هُم بِمَا'' on p.63 and ''بِهَا''
  on p.64), and وَأَنَّهُ هُوَ in the four places of al-Najm (43, 44, 48, 49).'
- 'idah 63-64: Ruways'' khulf places are جعل (al-Naḥl), قبل لهم, وأنه هو (al-Najm), لذهب بسمعهم, الكتب بأيديهم, الكتب بالحق (first place); the
  row-by-row wording is from the profile''s place list. Elsewhere only iẓhār (idah 65).'
- 'Case 5: wafi 64 says "فإن كان ما قبل الميم متحركا امتنع تسكينها" which reads as the reverse of the rule; the words listed there (إبراهيم بنيه,
  اليوم بجالوت, وأولوا الأرحام بعضهم) are the iẓhār ones, as the row has them. — re-read (wafi 64): The same page says just before that the mīm
  is made sākin and hidden when a vowelled letter precedes it (أعلم بكم, علم بالقلم). The sentence ''if what precedes the mīm is vowelled, its
  sukūn is prevented'' therefore contradicts the rule given a line earlier, and its examples (إبراهيم بنيه، اليوم بجالوت، أولوا الأرحام بعضهم)
  are the ones the table takes as iẓhār. The page''s own rule and examples settle that متحركا is a slip for ساكنا; the table (Sūsī ikhfāʾ after
  a vowelled letter, others iẓhār) is right.'
- 'Case 7: rawm for a damma or kasra and ishmām for a damma (wafi 65), both with khulf for al-Sūsī; the rows do not say whether a plain idghām
  without either is also a wajh. The four excepted forms (listed) are named without the reading al-Sūsī has there. — re-read (wafi 65, wafi 66):
  Wafi 66 says al-Sūsī has two madhhabs: pure idghām (maḥḍ, no ishmām or rawm), or pure idghām with ishmām outside the four forms, or rawm. So
  plain idghām is a wajh for a damma or kasra. In the four excepted forms (باء with باء, باء with ميم, ميم with ميم, ميم with باء) ishmām is impossible
  and he has pure idghām without ishmām on both madhhabs, with no rawm either on al-Shāṭibī''s view (rawm only on other muḥaqqiqīn''s view).'
- 'Case 8: wafi 67 calls it "الإخفاء" ("وبالإخفاء طبق مفصلا", the later authors'' way) and tags it rawm; id ikhfa_rawm is one wajh. Case 9 is
  idghām maḥḍ without rawm or ishmām ("لا خلاف").'
- Idghām of the madd/līn before-mudgham words and the confirming listed words (آل لوط, وياقوم مالى, هو, …) are the case default, listed as the
  book names them.
- 'wafi 54: al-Sūsī''s idghām within a word is only مناسككم and سلككم. Durrah''s tāʾ-in-tāʾ words are in case 2.'
- 'ruways in case ''mīm after a vowelled letter, before bāʾ (أعلم بكم)'': the Durrah is silent and his aṣl''s two ruwāt differ (izhar / ikhfa_mim);
  filled as Ḥafṣ for now — settled: Cases 5-9 are how al-Sūsī makes his idghām; Ruways and Rawḥ read iẓhār outside their listed words (idah 62,
