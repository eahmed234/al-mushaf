filled_notes:
- 'case nūn before yāʾ or wāw in the same word: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 138)'
- 'case the nūn of طس before the tāʾ of تلك: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 137)'
- 'case before bāʾ: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 139)'
- 'case before the remaining fifteen letters: no row speaks of ibn_wardan, ibn_jammaz, ruways, rawh, ishaq, idris (left empty; wafi 139)'
notes:
- 'Ibn Wardān and Ibn Jammāz at ء ه ع ح: idah 138 says he stayed on his aṣl (iẓhār); given via aṣl (Nāfiʿ), the aṣl''s reading is not in these
  rows beyond wafi 139 (all fourteen iẓhār).'
- Idah 138 gives the Durrah nothing for the yāʾ/wāw-in-one-word case, the tāʾ of تلك, iqlāb or the fifteen ikhfāʾ letters; al-Wāfī 138-139 gives
  only the fourteen.
- The nūn before lām, rāʾ, yāʾ, wāw, mīm, nūn (idghām) is the category idgham_ghunna, not repeated here.
