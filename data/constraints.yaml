# Taḥrīr: which wujūh of different categories go together in one reading (allowed tuples).
# Read from the books' pages, not from memory. A constraint applies when every one of its
# categories occurs in the passage being read; the order of the places doesn't matter.

- id: warsh_badal_lin  # tarbīʿ (Eisa's review note on badal and lin_hamz)
  rawi: [warsh]
  cats: [badal, lin_hamz]
  allowed: [[qasr, tawassut], [tawassut, tawassut], [tul, tawassut], [tul, tul]]
  cite: dabba 201-202
  source: "al-Ḍabbāʿ, Sharḥ Itḥāf al-Bariyyah, v. 49: وفي بدل أجر الثلاثة عندما توسط لينا وامددن إن تطولا; p. 202: the same whether the līn comes first or the badal (e.g. شَيۡـٔٗا … ٱلۡأٓخِرَةِ)"
  status: candidate

- id: warsh_badal_dhawat_ya
  rawi: [warsh]
  cats: [badal, imala_ya]
  allowed: [[qasr, fath], [tawassut, taqlil], [tul, fath], [tul, taqlil]]
  cite: dabba 246; budur 30
  cond: "not for the ruʾūs al-āy of the eleven surahs (taqlīl with every badal), nor عَادًا ٱلۡأُولَىٰ and ءَآلۡـَٰٔنَ (dabba 246 n. 1)"
  source: "al-Ḍabbāʿ p. 246: no taqlīl on qaṣr of the badal, no fatḥ on its tawassuṭ, both on its madd; al-Budūr p. 30 (2:34 ءَادَمَ … أَبَىٰ), the same either order"
  status: candidate

# Waqf of Ḥamzah's ruwāt: the waqf form goes with the sakt they read in waṣl. Sakt is a choice in
# generation now (2026-11-24); Khalaf's mafṣūl one still waits on stops at a word starting with a hamzah.
- id: khallad_sakt_al_waqf
  rawi: [khallad]
  cats: [sakt_al, waqf_al]  # waqf_al: the stop on a word with lām al-taʿrīf before a hamzah (ٱلۡأَرۡضِ)
  allowed: [[sakt, naql], [sakt, sakt], [none, naql]]
  cite: wafi 106; budur 41; budur 25
  source: "al-Budūr p. 25: those who read al- without sakt in waṣl all take naql at the stop; al-Wāfī p. 106: reading Khallād with sakt on al- and shayʾ, the stop on ٱلۡأَرۡضِ is naql or sakt; without it, naql only (the muḥaqqiqūn reject plain taḥqīq). al-Budūr p. 41 (قُلۡ ءَأَنتُمۡ): Khallād, no sakt: tas-hīl or taḥqīq of the second hamzah; naql: tas-hīl only"
  status: candidate
  enforced: true

- id: khalaf_sakt_mafsul_waqf
  rawi: [khalaf_an_hamzah]
  cats: [sakt_mafsul, waqf_initial]  # waqf_initial: the stop on a word starting with a hamzah after a sākin (مَنۡ ءَامَنَ)
  allowed: [[sakt, naql], [sakt, sakt], [none, naql], [none, none]]
  cite: wafi 106; budur 21
  source: "al-Budūr p. 21 (عَذَابٌ أَلِيمٌ, 2:10): Khalaf three at the stop (sakt, naql, neither), Khallād two (naql, taḥqīq without sakt); al-Wāfī p. 106: Khalaf stopping on مَنۡ ءَامَنَ has naql, sakt (Abū al-Fatḥ's way, with sakt on the mafṣūl) or neither (Ibn Ghalbūn's, without it); Khallād naql or neither"
  status: candidate
  enforced: false

- id: hamzah_hishm_two_tashil
  rawi: [khalaf_an_hamzah, khallad, hisham]
  note: "two tas-hīls after an alif in one word take the same length (هَٰٓؤُلَآءِ: 13 wujūh, al-Budūr p. 65); enforced inside spike/waqf.py"
  cite: budur 65
  status: candidate
  enforced: true

# al-Budūr's per-place taḥrīr for al-Fātiḥah and al-Baqarah 1-20 (pp. 15-26). Each is about a
# feature the spike doesn't model as text yet (madd degrees, madd ʿāriḍ at a stop), so recorded,
# not enforced; checked against al-Futūḥ when those features are modelled.
- id: warsh_badal_arid
  rawi: [warsh]
  cats: [badal, madd_arid]  # madd_arid: madd ʿāriḍ li-l-sukūn at the stop (بِمُؤۡمِنِينَ)
  allowed: [[qasr, qasr], [qasr, tawassut], [qasr, ishba], [tawassut, tawassut], [tawassut, ishba], [tul, ishba]]
  cite: budur 21-22
  source: "al-Budūr p. 21 (2:8 بِمُؤۡمِنِينَ): Warsh six wujūh: qaṣr of both badals with the three of the ʿāriḍ, their tawassuṭ with tawassuṭ or madd of the ʿāriḍ, their madd with madd; p. 22 (مُسۡتَهۡزِءُونَ) the same reasoning"
  status: candidate
  enforced: true

- id: badal_equal
  rawi: [warsh]
  note: "a badal with its hamzah kept and one changed by naql (ءَامَنَّا … ٱلۡأٓخِرِ) take the same wajh: 'المعتمد وجوب التسوية' (al-Budūr p. 20). The spike makes one choice per category per span, so this holds already."
  cite: budur 20
  status: candidate
  enforced: implicit

- id: madd_degrees
  note: "muttaṣil and munfaṣil in degrees: Qālūn and al-Dūrī with muttaṣil 2½ alifs take munfaṣil 2½ or qaṣr, with 2 alifs qaṣr only; ʿĀṣim's munfaṣil follows his muttaṣil (2½ or 2); Ibn ʿĀmir, al-Kisāʾī, Khalaf 2 in both; Warsh and Ḥamzah 3 in both (al-Budūr pp. 18-19). The spike's madd wujūh are qaṣr / tawassuṭ / ishbāʿ, not degrees."
  cite: budur 18-19
  status: decided
  decision: "Madd lengths are three: qaṣr 1, tawassuṭ 2, ṭūl 3 alifs, al-Shāṭibī's two degrees above qaṣr (al-Budūr p. 18); the rest of the book speaks only of qaṣr and madd. Under that model this constraint holds by itself (muttaṣil is never qaṣr; who has two degrees has them in both). The four-degree way with its fractions (fuwayq) waits for the kubrā version (Eisa 2026-11-25)."
  enforced: false
